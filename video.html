<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>七塚 動画分析</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#18334e;font-family:system-ui,-apple-system,sans-serif}header{background:#102e4e;color:#fff;padding:16px}main{max-width:850px;margin:auto;padding:12px}.card{background:white;border-radius:14px;padding:15px;margin:10px 0}video{width:100%;max-height:60vh;background:#111;border-radius:8px}button,select,input{font:inherit;padding:11px;border:1px solid #cad5df;border-radius:10px;background:white;color:#18334e}button{touch-action:manipulation}button.primary{background:#1663ad;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid button{padding:12px 3px;font-size:13px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.muted{font-size:12px;color:#64748b}.log{padding:9px 0;border-bottom:1px solid #ddd}label{display:block;margin:10px 0}input[type=file]{max-width:100%}input[type=range]{width:100%}</style></head><body><header><b>🎬 七塚 Volley Stats 動画分析</b><div style="font-size:12px">端末内の動画を使う無料モード</div></header><main><div class="card"><a href="./index.html">← 試合記録へ戻る</a><label>① 動画を選択 <input id="file" type="file" accept="video/*"></label><p class="muted">動画はクラウドに送信しません。画面を閉じた場合は再度選択してください。</p><video id="video" playsinline preload="metadata" controls></video><input type="range" id="seek" min="0" max="1000" value="0"><div class="row" style="justify-content:space-between"><strong id="clock">00:00.000 / 00:00.000</strong><span id="info" class="muted"></span></div><div class="grid"><button id="back5">−5秒</button><button id="prev">◀ 1コマ</button><button id="next">1コマ ▶</button><button id="plus5">＋5秒</button></div><div class="row" style="margin-top:9px"><button id="play" class="primary">▶ 再生／停止</button><label>速度 <select id="speed"><option value=".25">0.25倍</option><option value=".5">0.5倍</option><option value=".75">0.75倍</option><option value="1" selected>通常</option><option value="1.5">1.5倍</option></select></label><label>コマ幅 <select id="fps"><option value="30">30fps</option><option value="60">60fps</option><option value="24">24fps</option></select></label></div><p class="muted">コマ送りは指定fps相当の時間移動です。iPhoneの動画形式やSafariの仕様によって正確な1フレーム表示にならない場合があります。</p></div><div class="card"><h3>② プレーのメモ（動画時刻付き）</h3><div class="row"><input id="who" placeholder="選手名・背番号" style="flex:1;min-width:120px"><select id="skill"><option>サーブ</option><option>レシーブ</option><option>オーバー</option><option>トス</option><option>アタック</option><option>ブロック</option><option>ディグ</option><option>その他</option></select><select id="result"><option>成功</option><option>継続</option><option>ミス</option></select></div><label>詳細 <input id="detail" placeholder="例：オーバーがネット側へ流れた" style="width:100%"></label><button class="primary" id="add">現在時刻で記録</button><button id="export">メモをCSV出力</button><p class="muted">メモはこの端末に保存されます。動画ファイルとの紐付けはファイル名による簡易管理です。大切な記録はCSV出力してください。</p><div id="logs"></div></div></main><script>
const $=id=>document.getElementById(id),v=$('video');let url='',key='',logs=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=t=>{t=Math.max(0,t||0);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+String(Math.round(t%1*1000)).padStart(3,'0')};function render(){ $('logs').innerHTML=logs.map((e,i)=>'<div class="log"><button data-jump="'+i+'">'+fmt(e.time)+'</button> '+esc(e.who)+' / '+esc(e.skill)+' / '+esc(e.result)+'　'+esc(e.detail)+' <button data-delete="'+i+'">削除</button></div>').join('')||'<p class="muted">まだメモがありません</p>'}function save(){if(key)localStorage.setItem(key,JSON.stringify(logs));render()}$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;key='nanatsuka-video-notes:'+f.name+':'+f.size;try{logs=JSON.parse(localStorage.getItem(key)||'[]')}catch{logs=[]}render();$('info').textContent=f.name};function move(t){if(!Number.isFinite(v.duration))return;v.pause();v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+t))}function sync(){if(Number.isFinite(v.duration)&&v.duration>0){$('seek').value=Math.round(1000*v.currentTime/v.duration);$('clock').textContent=fmt(v.currentTime)+' / '+fmt(v.duration)}}v.ontimeupdate=sync;v.onseeked=sync;v.onloadedmetadata=sync;$('seek').oninput=e=>{if(Number.isFinite(v.duration))v.currentTime=v.duration*Number(e.target.value)/1000};$('back5').onclick=()=>move(-5);$('plus5').onclick=()=>move(5);$('prev').onclick=()=>move(-1/Number($('fps').value));$('next').onclick=()=>move(1/Number($('fps').value));$('play').onclick=()=>v.paused?v.play().catch(()=>{}):v.pause();$('speed').onchange=e=>v.playbackRate=Number(e.target.value);$('add').onclick=()=>{if(!key)return alert('先に動画を選択してください');logs.push({time:v.currentTime,who:$('who').value.trim()||'未指定',skill:$('skill').value,result:$('result').value,detail:$('detail').value.trim()});save();$('detail').value=''};$('logs').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.jump!==undefined){v.currentTime=logs[Number(b.dataset.jump)].time;v.pause()}if(b.dataset.delete!==undefined&&confirm('このメモを削除しますか？')){logs.splice(Number(b.dataset.delete),1);save()}};$('export').onclick=()=>{if(!logs.length)return alert('メモがありません');let rows=[['動画時刻（秒）','選手','プレー','結果','詳細'],...logs.map(e=>[e.time.toFixed(3),e.who,e.skill,e.result,e.detail])];let csv='\ufeff'+rows.map(r=>r.map(s=>'"'+String(s).replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='volley_video_notes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></body></html>
