function matchMaxSets(m){return [1,2,3].includes(Number(m.maxSets))?Number(m.maxSets):3}function setTarget(m){return matchMaxSets(m)===3&&m.set===3?15:21}function matchComplete(m){if(m.set<matchMaxSets(m))return false;return setFinished(m)}function setFinished(m){let s=m.sets[m.set-1]||{ours:0,theirs:0},target=setTarget(m);return Math.max(s.ours,s.theirs)>=target&&Math.abs(s.ours-s.theirs)>=2}

function markCourtChange(){let m=match();if(!m)return;m.courtChanged=true;persist();draw()}

function matchDecided(m){const w=matchSetWins(m),max=matchMaxSets(m);return max===3?(w.ours>=2||w.theirs>=2):max===2?(m.set>=2&&setFinished(m)):setFinished(m)}
function quickAdvanceSet(m){if(m.set>=matchMaxSets(m)||matchDecided(m))return;const oldSet=m.set;const first=m.firstSetServing||m.pointEvents?.find(e=>Number(e.set)===1)?.servingSide||m.serving;m.firstSetServing=first;m.actions??=[];m.actions.push({type:'set',prev:oldSet,prevServing:m.serving??null,prevServeIndex:m.serveIndex||0,prevHasServed:!!m.hasServed,prevOrder:[...(m.serveOrder||[])]});m.set++;m.sets??=[];m.sets[m.set-1]??={ours:0,theirs:0};m.hasServed=false;m.serveIndex=0;m.courtChanged=false;m.serving=m.set===2?(first==='ours'?'theirs':'ours'):null;persist();draw();if(m.set===3){const ours=confirm('第3セットはコイントスで決定します。\n七塚からサーブですか？\nOK：七塚サーブ ／ キャンセル：相手サーブ');m.serving=ours?'ours':'theirs';persist();draw()}else alert('第2セットのサーブ権は自動で「'+(m.serving==='ours'?'七塚':'相手')+'」に設定しました。')}

function quickServeEvents(m){return (m.pointEvents||[]).filter(e=>e.servingSide==='ours'&&e.servingPlayerId!=null).map(e=>{let miss=e.reason?.includes('七塚のサーブミス'),ace=e.reason==='サービスエース';return {set:e.set,skill:'サーブ',playerId:e.servingPlayerId,result:miss?'ミス':ace?'エース':'成功',time:e.time,automatic:true}})}function quickPointEvents(m){return (m.pointEvents||[]).flatMap(e=>{let r=e.reason||'',skill=null,result=null,id=e.playerId;if(e.side==='ours'){if(r==='サービスエース'||r==='サーブで崩して得点')return [];if(r.includes('ツーアタック決定')){skill='ツーアタック';result='決定'}else if(r.includes('スパイク決定')||r.includes('プッシュ決定')||r.includes('フェイント決定')||r.includes('ブロックアウト')||r.includes('ダイレクト返球決定')){skill='スパイク';result='決定'}else if(r==='ブロック決定'){skill='ブロック';result='得点'}else if(r.startsWith('相手の')){skill='相手のミス';result=r;id=null}}else{if(r.startsWith('七塚のサーブミス'))return [];if(r.startsWith('サーブレシーブミス')){skill='サーブレシーブ';result='ミス'}else if(r.startsWith('ディグミス')||r.startsWith('七塚のレシーブミス')||r.startsWith('フェイント対応ミス')||r.startsWith('チャンスボール処理ミス')){skill='ディグ';result='ミス'}else if(r.startsWith('七塚のスパイクミス')||r==='七塚のスパイクがブロックされた'){skill='スパイク';result='ミス'}else if(r.startsWith('ツーアタックミス')){skill='ツーアタック';result='ミス'}else if(r.startsWith('七塚のブロックミス')||r.startsWith('七塚のブロックアウト')){skill='ブロック';result='ミス'}else if(r==='七塚のトスミス'){skill='セッターのトス';result='ミス'}else if(r.startsWith('ラストボール返球ミス')){skill='返球';result=r.includes('オーバー')?'オーバー':r.includes('アンダー')?'アンダー':'打って返す'}else if(r.includes('お見合い')){skill='連携ミス';result='お見合い';id=null}else if(r.startsWith('七塚のつなぎミス')||r.startsWith('返球失敗')){skill='2段トス';result='ミス'}}if(!skill)return [];if(id==null&&skill!=='相手のミス'&&skill!=='連携ミス')return [];return [{set:e.set,skill,playerId:id,result,detail:r,time:e.time,automatic:true,source:'point'}]})}

async function importRosterFile(input){let file=input.files?.[0];if(!file)return;try{if(typeof XLSX==='undefined')throw Error('Excel読み込みライブラリが使えません。通信を確認してください');let book=XLSX.read(await file.arrayBuffer(),{type:'array'}),incoming=[];for(let [sheetName,teamName] of [['男子名簿','男子'],['女子名簿','女子']]){let sheet=book.Sheets[sheetName];if(!sheet)continue;let rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});let h=rows.findIndex(r=>r.some(v=>String(v).trim()==='氏名'));if(h<0)continue;let col=rows[h].findIndex(v=>String(v).trim()==='氏名');for(let r of rows.slice(h+1)){let name=String(r[col]||'').trim();if(name)incoming.push({name,team:teamName})}}if(!incoming.length)throw Error('男子名簿・女子名簿の氏名列が見つかりません');let added=0;for(let p of incoming){let key=p.name.replace(/\s/g,'');if(!data.players.some(q=>(q.team||'女子')===p.team&&q.name.replace(/\s/g,'')===key)){data.players.push({id:uid(),name:p.name,number:'',team:p.team});added++}}persist();draw();alert('名簿'+incoming.length+'名を確認、'+added+'名を追加しました。既存データは保持しています。')}catch(e){alert('読み込み失敗：'+e.message)}finally{input.value=''}}
function addPlayer(){let name=$('pname').value.trim(),t=$('pteam').value;if(!name)return alert('名前を入力してください');if(data.players.some(p=>p.team===t&&p.name.replace(/\s/g,'')===name.replace(/\s/g,'')))return alert('登録済みの名前です');data.players.push({id:uid(),name,number:'',team:t});persist();draw()}

function wizardNext(){if(!matchWizard)return;if(matchWizard.step===1){let name=document.getElementById('wizardOpponent')?.value.trim();if(!name)return alert('対戦相手名を入力してください');matchWizard.opponent=name;matchWizard.team=document.getElementById('wizardTeam')?.value||team;matchWizard.maxSets=Number(document.getElementById('wizardFormat')?.value||3);if(data.players.filter(p=>(p.team||'女子')===matchWizard.team).length<6)return alert('このチームには6人以上の選手登録が必要です');matchWizard.step=2}else if(matchWizard.step===2){if(matchWizard.order.length!==6)return alert('サーブ順の6人を選んでください');matchWizard.step=3}else if(matchWizard.step===3){if(matchWizard.positions.some(x=>x==null))return alert('6つのポジションを設定してください');matchWizard.step=4}draw()}
function wizardBack(){if(matchWizard&&matchWizard.step>1){matchWizard.step--;draw()}}

const courtCodes=['L','S','R','LB','C','RB'];function courtCells(ids,order,editing){return courtCodes.map((code,i)=>'<div class="court-cell"><b>'+code+'</b>'+(editing?'<select onchange="setCourtPlayer('+i+',this.value)"><option value="">選手を選択</option>'+order.filter(id=>String(ids[i])===String(id)||!ids.some((chosen,k)=>k!==i&&chosen!=null&&String(chosen)===String(id))).map(id=>'<option value="'+esc(id)+'" '+(String(ids[i])===String(id)?'selected':'')+'>'+safeName(id)+'</option>').join('')+'</select>':'<button onclick="openQuickEntry('+JSON.stringify(ids[i])+')">'+safeName(ids[i])+'</button><button onclick="openQuickSub('+i+')">↔ 交代</button>')+'</div>').join('')}function setCourtPlayer(i,v){let w=matchWizard;if(!w)return;let id=w.order.find(x=>String(x)===String(v));if(id==null){w.positions[i]=null}else{let j=w.positions.findIndex((x,k)=>k!==i&&String(x)===String(id));if(j>=0)w.positions[j]=w.positions[i];w.positions[i]=id}draw()}

function exportExcelSummary(id){const m=data.matches.find(x=>x.id===id);if(!m)return;if(typeof XLSX==='undefined')return alert('Excel出力機能を読み込めません。通信状態を確認してください。');const records=individualAnalysis(m),points=m.pointEvents||[],book=XLSX.utils.book_new();const quickRows=[['セット','選手','プレー','評価','日時'],...(m.quickEvents||[]).map(e=>[e.set,e.playerId!=null?(player(e.playerId)?.name||'登録解除選手'):'チーム',e.skill,e.result,e.time])];XLSX.utils.book_append_sheet(book,XLSX.utils.aoa_to_sheet(quickRows),'簡易プレー記録');const allReasons=[...new Set(records.flatMap(r=>Object.keys(r.counts)))].sort((a,b)=>a.localeCompare(b,'ja'));const summary=[['七塚 Volley Stats 選手別分析'],['日付',m.date,'チーム',m.team,'対戦相手',m.opponent],['出場選手のみ。件数は記録された得失点に限ります（成功率ではありません）'],[],['選手','関与得点','関与失点','合計',...allReasons],...records.map(r=>[r.name,r.wins.length,r.losses.length,r.events.length,...allReasons.map(k=>r.counts[k]||0)])];const ws=XLSX.utils.aoa_to_sheet(summary);ws['!cols']=[{wch:22},{wch:15},{wch:15},{wch:12},...allReasons.map(()=>({wch:25}))];XLSX.utils.book_append_sheet(book,ws,'出場選手別集計');const missRows=[['選手','ミス分類','具体的な内容','件数']];for(const r of records){const misses=r.losses.filter(e=>!e.reason?.startsWith('相手の'));const counts={};for(const e of misses)counts[e.reason||'不明']=(counts[e.reason||'不明']||0)+1;for(const [reason,n] of Object.entries(counts).sort((a,b)=>b[1]-a[1]))missRows.push([r.name,reason.split('（')[0],reason,n])}const ms=XLSX.utils.aoa_to_sheet(missRows);ms['!cols']=[{wch:20},{wch:26},{wch:44},{wch:12}];XLSX.utils.book_append_sheet(book,ms,'選手別ミス詳細');const team={};for(const e of points){const k=(e.side==='ours'?'得点':'失点')+'｜'+(e.reason||'不明');team[k]=(team[k]||0)+1}const ts=XLSX.utils.aoa_to_sheet([['チーム得失点理由'],['得失点・理由','件数'],...Object.entries(team).sort((a,b)=>b[1]-a[1])]);ts['!cols']=[{wch:52},{wch:12}];XLSX.utils.book_append_sheet(book,ts,'チーム内訳');const details=[['セット','得失点','選手','理由','日時'],...points.map(e=>[e.set,e.side==='ours'?'得点':'失点',e.playerId!=null?(player(e.playerId)?.name||'登 function exportPrintReport(id){const m=data.matches.find(x=>x.id===id);if(!m)return;const records=individualAnalysis(m);const safe=x=>esc(String(x??''));const rows=records.map(r=>{const counts={};for(const e of r.losses.filter(e=>!e.reason?.startsWith('相手の')))counts[e.reason||'不明']=(counts[e.reason||'不明']||0)+1;const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return '<section class="person"><h2>'+safe(r.name)+'</h2><p>関与得点 '+r.wins.length+'件 ／ 関与失点 '+r.losses.length+'件</p><table><thead><tr><th>失点理由</th><th>件数</th></tr></thead><tbody>'+(top.map(([k,n])=>'<tr><td>'+safe(k)+'</td><td>'+n+'</td></tr>').join('')||'<tr><td colspan="2">記録なし</td></tr>')+'</tbody></table></section>'}).join('');const w=window.open('','_blank');if(!w)return alert('ポップアップを許可してください');w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>七塚 試合分析</title><style>body{font-family:system-ui,sans-serif;color:#18334e;margin:24px}h1{font-size:22px}.person{break-inside:avoid;margin:18px 0;padding:12px;border:1px solid #ccc;border-radius:8px}h2{font-size:17px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left}th:last-child,td:last-child{width:60px;text-align:right}.note{font-size:12px;color:#555}@media print{.noprint{display:none}body{margin:12mm}}</style></head><body><button class="noprint" onclick="window.print()">印刷・PDF保存</button><h1>七塚 Volley Stats 試合分析</h1><p>'+safe(m.date)+'　'+safe(m.team)+' vs '+safe(m.opponent)+'</p><p class="note">出場選手のみ表示。得失点時に記録した内容の件数であり、ミス率・成功率ではありません。</p>'+rows+'</body></html>');w.document.close()}

function exportCSV(id){let m=data.matches.find(x=>x.id===id);if(!m)return;let rows=[['日付','チーム','対戦相手','セット','時刻','得失点','背番号','選手','プレー・理由','結果']];for(let e of (m.pointEvents||[])){let p=player(e.playerId);rows.push([m.date,m.team,m.opponent,e.set,e.time,e.side==='ours'?'得点':'失点',p?.number||'',p?.name||e.actor||'不明',e.reason||'',e.side==='ours'?'＋1':'－1'])}for(let e of (m.events||[])){let p=player(e.playerId);rows.push([m.date,m.team,m.opponent,e.set,e.time,'旧プレー記録',p?.number||'',p?.name||'不明',e.skill,e.result])}download('volley_'+m.id+'.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('volley_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,...data},null,2),'application/json')}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw Error('形式が違います');if(!confirm('現在のデータをバックアップファイルの内容で上書きしますか？'))return;data={players:d.players,matches:d.matches,current:d.current??null};persist();selected=null;draw();alert('復元しました')}catch(e){alert('復元できません：'+e.message)}}draw();
