<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e4e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="七塚Volley"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>七塚 Volley Stats v2</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#142b43;background:#edf2f7}*{box-sizing:border-box}body{margin:0}header{background:#102e4e;color:white;padding:15px 16px}header small{display:block;color:#c6d9eb;margin-top:3px}main{max-width:850px;margin:auto;padding:12px;padding-bottom:70px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #cbd6e2;border-radius:11px;background:white;padding:11px;color:inherit;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}.tabs button{font-size:13px;padding:12px 2px}.tabs .on,.primary{background:#1663ad;color:white;border-color:#1663ad}.card{background:white;border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:0 2px 8px #1b3b5910}h2{font-size:17px;margin:0 0 12px}.muted{font-size:12px;color:#65778a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,select{border:1px solid #cbd6e2;border-radius:9px;padding:10px;max-width:100%}.wide{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.court{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e6b57e;border:3px solid #e9a35e;border-radius:13px;padding:12px 8px;position:relative}.court:after{content:"ネット";position:absolute;left:0;right:0;top:50%;border-top:3px solid white;text-align:center;font-size:10px;color:#633b19;pointer-events:none}.court button{min-height:79px;display:flex;flex-direction:column;justify-content:center;gap:3px;border:2px solid #ffffff99;background:#fffdf4;font-weight:700}.court button.selected{background:#1465ae;color:white;border-color:#103c71}.court .num{font-size:23px}.court .pname{font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:100%}.skill button,.result button{min-height:57px;font-weight:700}.skill .selected{background:#d8eafd;border:2px solid #1663ad}.result button{color:white;border:0}.success{background:#15804e}.continue{background:#53718c}.error{background:#c2413a}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}.score strong{font-size:35px}.score button{width:100%}.label{font-size:12px;color:#64748b}.log{border-bottom:1px solid #e5eaf0;padding:9px 0;font-size:13px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #e2e8f0;padding:9px 5px;text-align:left;white-space:nowrap}.scroll{overflow-x:auto}.pill{display:inline-block;background:#e7f1fb;padding:5px 9px;border-radius:99px;font-size:12px}.danger{color:#ad2e29}.hint{background:#f1f6fc;padding:10px;border-radius:9px;font-size:12px;color:#41566c}button:focus-visible{outline:3px solid #f6b74b} @media(max-width:370px){.court button{min-height:70px}.court .num{font-size:19px}}
</style></head><body><header><b>🏐 七塚 Volley Stats <span style="font-size:12px">v2.0</span></b><small>試合中タップ記録・6人制対応</small></header><main><div class="tabs" id="tabs"></div><div id="app"></div></main><script>
'use strict';const KEY='nanatsuka-volley-v2',OLD='nanatsuka-volley-v1';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now()+Math.floor(Math.random()*100000);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data){let old;try{old=JSON.parse(localStorage.getItem(OLD))}catch{}data=old?{players:old.players.map(p=>({...p,team:'女子'})),matches:old.matches.map(m=>({...m,team:'女子',sets:[{ours:0,theirs:0}],set:1,lineup:[],events:m.events.map(e=>({...e,set:1}))})),current:old.current}: {players:[],matches:[],current:null};}data.players??=[];data.matches??=[];let tab='record',selected=null,skill='サーブ',reportId=null,team='女子';const skills=['サーブ','レシーブ','トス','アタック','ブロック','ディグ'];const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('保存できませんでした。端末の保存容量を確認してください。')}};const match=()=>data.matches.find(m=>m.id===data.current);const player=id=>data.players.find(p=>String(p.id)===String(id));const roster=()=>data.players.filter(p=>(p.team||'女子')===team);const btn=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;const safeName=id=>{let p=player(id);return p?`#${esc(p.number)} ${esc(p.name)}`:'登録解除選手'};function draw(){let m=match();$('tabs').innerHTML=[['record','🏐 記録'],['report','📊 分析'],['players','👥 選手'],['history','🗂 履歴']].map(([k,v])=>btn(v,`tab='${k}';draw()`,tab===k?'on':'')).join('');$('app').innerHTML=tab==='record'?recordPage(m):tab==='report'?reportPage():tab==='players'?playersPage():historyPage();}
function recordPage(m){let line=m?.lineup||[];let eligible=data.players.filter(p=>(p.team||'女子')===(m?.team||team));return `<section class="card"><h2>試合設定</h2><div class="row"><label>チーム <select id="team" onchange="team=this.value;draw()"><option ${team==='女子'?'selected':''}>女子</option><option ${team==='男子'?'selected':''}>男子</option></select></label><input id="opponent" placeholder="対戦相手（例：小坂）" style="flex:1" value=""><button class="primary" onclick="startMatch()">新規試合</button></div>${m?`<p class="muted">記録中：${esc(m.team)} vs ${esc(m.opponent)} ／ ${esc(m.date)} <span class="pill">第${m.set}セット</span></p>`:'<p class="muted">選手登録後、対戦相手を入力して新規試合を開始してください。</p>'}</section>${m?`<section class="card"><div class="score"><div><div class="label">七塚</div><strong>${m.sets[m.set-1]?.ours||0}</strong>${btn('＋1点',"score('ours',1)",'primary')}</div><div><b>第${m.set}セット</b><div style="font-size:22px">―</div>${btn('次のセット', 'nextSet()')}</div><div><div class="label">${esc(m.opponent)}</div><strong>${m.sets[m.set-1]?.theirs||0}</strong>${btn('＋1点',"score('theirs',1)")}</div></div><div class="row" style="justify-content:center;margin-top:10px">${btn('↶ 得点を戻す','undoScore()')} ${btn('↶ 最後の操作を取消','undo()')}</div></section><section class="card"><h2>① コートの選手をタップ</h2><div class="court">${[3,2,4,6,1,5].map(pos=>{let id=line[pos-1];return `<button class="${selected===id&&id!=null?'selected':''}" onclick="selectPosition(${pos})"><span class="label">位置 ${pos}</span><span class="num">${id!=null?esc(player(id)?.number||'–'):'＋'}</span><span class="pname">${id!=null?esc(player(id)?.name||'登録解除'):'選手設定'}</span></button>`}).join('')}</div><div class="row" style="margin-top:10px">${btn('↻ ローテーション','rotate()')} ${btn('6人を設定','setLineup()')} <span class="muted">選択：${selected!=null?safeName(selected):'なし'}</span></div></section><section class="card"><h2>② プレーを選ぶ</h2><div class="grid3 skill">${skills.map(s=>btn(esc(s),`chooseSkill('${s}')`,skill===s?'selected':'')).join('')}</div></section><section class="card"><h2>③ 結果をワンタップで記録</h2><div class="grid3 result">${btn('✓ 成功',"addEvent('成功')",'success')}${btn('↻ 継続',"addEvent('継続')",'continue')}${btn('✕ ミス',"addEvent('ミス')",'error')}</div><p class="hint">成功＝良いプレー、継続＝ラリー継続、ミス＝失敗。得点は上の「＋1点」で別途記録します。</p></section><section class="card"><h2>直近のプレー（${m.events.length}件）</h2>${m.events.slice(-7).reverse().map(e=>`<div class="log">第${e.set||1}セット　${safeName(e.playerId)} ／ ${esc(e.skill)} ／ <b>${esc(e.result)}</b></div>`).join('')||'<p class="muted">まだ記録がありません。</p>'}</section>`:''}`}
function playersPage(){return `<section class="card"><h2>選手登録</h2><div class="row"><select id="pteam"><option>女子</option><option>男子</option></select><input id="pnum" type="number" min="0" placeholder="背番号" style="width:90px"><input id="pname" placeholder="選手名" style="flex:1"><button class="primary" onclick="addPlayer()">追加</button></div><p class="muted">最初に選手を登録してください。データのない選手名は自動補完しません。</p></section>${['女子','男子'].map(t=>`<section class="card"><h2>${t}（${data.players.filter(p=>p.team===t).length}名）</h2>${data.players.filter(p=>p.team===t).map(p=>`<div class="log row" style="justify-content:space-between"><span>${safeName(p.id)}</span>${btn('登録解除',`removePlayer(${JSON.stringify(p.id)})`)}</div>`).join('')||'<p class="muted">未登録</p>'}</section>`).join('')}`}
function reportPage(){let m=data.matches.find(x=>x.id===reportId)||match()||data.matches.at(-1);if(!m)return '<section class="card">まだ試合データがありません。</section>';let stats={};for(let e of m.events){let key=e.playerId+'|'+e.skill;stats[key]??={count:0,good:0,miss:0};stats[key].count++;if(e.result==='成功')stats[key].good++;if(e.result==='ミス')stats[key].miss++}return `<section class="card"><h2>選手別プレー分析</h2><select class="wide" onchange="reportId=Number(this.value);draw()">${data.matches.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.date)} ${esc(x.team)} vs ${esc(x.opponent)}</option>`).join('')}</select><p>総記録 ${m.events.length}件 ／ ${m.sets.length}セット</p><div class="scroll"><table><thead><tr><th>選手</th><th>プレー</th><th>記録</th><th>成功</th><th>ミス</th><th>成功率</th></tr></thead><tbody>${Object.entries(stats).map(([key,v])=>{let [id,s]=key.split('|');return `<tr><td>${safeName(id)}</td><td>${esc(s)}</td><td>${v.count}</td><td>${v.good}</td><td>${v.miss}</td><td>${(100*v.good/v.count).toFixed(1)}%</td></tr>`}).join('')}</tbody></table></div><p class="muted">成功率＝成功÷全記録。公式スタッツの評価基準ではなく、練習改善用の簡易指標です。</p><div class="row">${btn('CSV出力',`exportCSV(${m.id})`,'primary')}${btn('JSONバックアップ','backup()')}</div></section>`}
function historyPage(){return `<section class="card"><h2>試合履歴</h2>${data.matches.slice().reverse().map(m=>`<div class="log"><b>${esc(m.date)} ${esc(m.team)} vs ${esc(m.opponent)}</b><div class="row" style="margin-top:7px">${btn('記録を再開',`openMatch(${m.id})`)}${btn('分析',`reportId=${m.id};tab='report';draw()`)}${btn('削除',`deleteMatch(${m.id})`,'danger')}</div></div>`).join('')||'<p>履歴はありません。</p>'}</section><section class="card"><h2>データ管理</h2><div class="row">${btn('全データをバックアップ','backup()','primary')}<label class="pill">JSON復元 <input type="file" accept="application/json,.json" onchange="restore(this.files[0])" style="max-width:190px"></label></div><p class="muted">データはこのブラウザ内に保存されます。端末変更・履歴削除に備えて定期的にバックアップしてください。</p></section>`}
function addPlayer(){let name=$('pname').value.trim(),number=$('pnum').value.trim(),t=$('pteam').value;if(!name||!number)return alert('名前と背番号を入力してください');if(data.players.some(p=>p.team===t&&String(p.number)===number))return alert('同じチームに同じ背番号が登録されています');data.players.push({id:uid(),name,number,team:t});persist();draw()}
function removePlayer(id){if(!confirm('登録解除しますか？過去の記録は残ります。'))return;data.players=data.players.filter(p=>p.id!==id);persist();draw()}
function startMatch(){let name=$('opponent').value.trim();if(!name)return alert('対戦相手を入力してください');if(!data.players.some(p=>p.team===team))return alert('先に「選手」で選手を登録してください');let m={id:uid(),team,opponent:name,date:new Date().toLocaleDateString('ja-JP'),set:1,sets:[{ours:0,theirs:0}],lineup:[null,null,null,null,null,null],events:[],actions:[]};data.matches.push(m);data.current=m.id;selected=null;persist();draw();setLineup()}
function setLineup(){let m=match();if(!m)return;let candidates=data.players.filter(p=>p.team===m.team);let input=prompt('位置1→6の背番号をカンマ区切りで入力（例：1,2,3,4,5,6）。空欄は未設定。\n登録済：'+candidates.map(p=>p.number+':'+p.name).join(' / '),m.lineup.map(id=>player(id)?.number||'').join(','));if(input===null)return;let nums=input.split(',').map(x=>x.trim());if(nums.length!==6)return alert('6つの位置をカンマ区切りで指定してください');let arr=nums.map(n=>n?candidates.find(p=>String(p.number)===n)?.id:null);if(nums.some((n,i)=>n&&arr[i]==null)||new Set(arr.filter(x=>x!=null)).size!==arr.filter(x=>x!=null).length)return alert('背番号が未登録、または重複しています');m.lineup=arr;selected=null;persist();draw()}
function selectPosition(pos){let m=match(),id=m.lineup[pos-1];if(id==null){setLineup();return}selected=id;draw()}
function rotate(){let m=match();m.actions??=[];m.actions.push({type:'lineup',prev:[...m.lineup]});m.lineup=[m.lineup[1],m.lineup[2],m.lineup[3],m.lineup[4],m.lineup[5],m.lineup[0]];persist();draw()}
function chooseSkill(s){skill=s;draw()}
function addEvent(result){let m=match();if(selected==null)return alert('先にコート上の選手を選んでください');m.actions??=[];m.events.push({playerId:selected,skill,result,set:m.set,time:new Date().toISOString()});m.actions.push({type:'event'});persist();draw()}
function score(side,delta){let m=match();m.actions??=[];m.sets[m.set-1][side]+=delta;m.actions.push({type:'score',set:m.set,side});persist();draw()}
function undoScore(){let m=match(),s=m.sets[m.set-1];let side=prompt('取り消す得点を選択：七塚なら 1、相手なら 2','1');if(side===null)return;let k=side==='1'?'ours':side==='2'?'theirs':null;if(!k)return alert('1 または 2 を入力してください');if(s[k]>0){s[k]--;m.actions??=[];m.actions.push({type:'scoreCorrection',set:m.set,side:k});persist();draw()}}
function nextSet(){let m=match();if(!confirm('次のセットを開始しますか？'))return;m.actions??=[];m.actions.push({type:'set',prev:m.set});m.set++;m.sets[m.set-1]??={ours:0,theirs:0};persist();draw()}
function undo(){let m=match();if(!m)return;m.actions??=[];let a=m.actions.pop();if(!a)return alert('取り消す操作がありません');if(a.type==='event')m.events.pop();if(a.type==='score')m.sets[a.set-1][a.side]=Math.max(0,m.sets[a.set-1][a.side]-1);if(a.type==='scoreCorrection')m.sets[a.set-1][a.side]++;if(a.type==='lineup')m.lineup=a.prev;if(a.type==='set')m.set=a.prev;persist();draw()}
function openMatch(id){data.current=id;selected=null;tab='record';persist();draw()}
function deleteMatch(id){if(!confirm('この試合と記録を完全に削除しますか？'))return;data.matches=data.matches.filter(m=>m.id!==id);if(data.current===id)data.current=data.matches.at(-1)?.id||null;persist();draw()}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(id){let m=data.matches.find(x=>x.id===id);if(!m)return;let rows=[['日付','チーム','対戦相手','セット','時刻','背番号','選手','プレー','結果'],...m.events.map(e=>{let p=player(e.playerId);return [m.date,m.team,m.opponent,e.set,e.time,p?.number||'',p?.name||'登録解除選手',e.skill,e.result]})];download('volley_'+m.id+'.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('volley_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,...data},null,2),'application/json')}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw Error('形式が違います');if(!confirm('現在のデータをバックアップファイルの内容で上書きしますか？'))return;data={players:d.players,matches:d.matches,current:d.current??null};persist();selected=null;draw();alert('復元しました')}catch(e){alert('復元できません：'+e.message)}}draw();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
