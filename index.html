<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e4e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="七塚Volley"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>七塚 Volley Stats v2</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#142b43;background:#edf2f7}*{box-sizing:border-box}body{margin:0}header{background:#102e4e;color:white;padding:15px 16px}header small{display:block;color:#c6d9eb;margin-top:3px}main{max-width:850px;margin:auto;padding:12px;padding-bottom:70px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #cbd6e2;border-radius:11px;background:white;padding:11px;color:inherit;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}.tabs button{font-size:13px;padding:12px 2px}.tabs .on,.primary{background:#1663ad;color:white;border-color:#1663ad}.card{background:white;border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:0 2px 8px #1b3b5910}h2{font-size:17px;margin:0 0 12px}.muted{font-size:12px;color:#65778a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,select{border:1px solid #cbd6e2;border-radius:9px;padding:10px;max-width:100%}.wide{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.court{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e6b57e;border:3px solid #e9a35e;border-radius:13px;padding:12px 8px;position:relative}.court:before{content:"ネット（相手コート側）";position:absolute;left:0;right:0;top:0;border-top:5px solid #fff;text-align:center;font-size:11px;color:#633b19;pointer-events:none}.court{padding-top:28px}.court button{min-height:79px;display:flex;flex-direction:column;justify-content:center;gap:3px;border:2px solid #ffffff99;background:#fffdf4;font-weight:700}.court button.selected{background:#1465ae;color:white;border-color:#103c71}.court .num{font-size:23px}.court .pname{font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:100%}.skill button,.result button{min-height:57px;font-weight:700}.skill .selected{background:#d8eafd;border:2px solid #1663ad}.result button{color:white;border:0}.success{background:#15804e}.continue{background:#53718c}.error{background:#c2413a}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}.score strong{font-size:35px}.score button{width:100%}.label{font-size:12px;color:#64748b}.log{border-bottom:1px solid #e5eaf0;padding:9px 0;font-size:13px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #e2e8f0;padding:9px 5px;text-align:left;white-space:nowrap}.scroll{overflow-x:auto}.pill{display:inline-block;background:#e7f1fb;padding:5px 9px;border-radius:99px;font-size:12px}.danger{color:#ad2e29}.hint{background:#f1f6fc;padding:10px;border-radius:9px;font-size:12px;color:#41566c}button:focus-visible{outline:3px solid #f6b74b} @media(max-width:370px){.court button{min-height:70px}.court .num{font-size:19px}}
.modal-open{overflow:hidden}.score-modal-backdrop{position:fixed;inset:0;z-index:1000;background:#091d36a8;display:flex;align-items:center;justify-content:center;padding:12px}.score-modal{background:white;border-radius:18px;width:min(100%,560px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;box-shadow:0 12px 48px #071b3555;overflow:hidden}.score-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e2e8f0}.score-modal-head button{padding:8px 12px}.score-modal-body{overflow-y:auto;overscroll-behavior:contain;padding:16px;-webkit-overflow-scrolling:touch}.score-modal-body .grid2 button,.score-modal-body .grid3 button{min-height:54px;font-weight:700}.score-modal-body .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:600px){.score-modal-backdrop{align-items:flex-end;padding:0}.score-modal{border-radius:20px 20px 0 0;max-height:92dvh;width:100%;padding-bottom:env(safe-area-inset-bottom)}}
</style></head><body><header><b>🏐 七塚 Volley Stats <span style="font-size:12px">v2.0</span></b><small>試合中タップ記録・6人制対応</small></header><main><div class="card" style="padding:10px;margin-bottom:10px"><a href="./video-excel.html" style="display:block;text-align:center;font-weight:700;color:#1663ad;text-decoration:none">🎬 動画分析（スロー再生・コマ送り） →</a></div><div class="tabs" id="tabs"></div><div id="app"></div></main><div id="scoreModalRoot"></div><script>
'use strict';const KEY='nanatsuka-volley-v2',OLD='nanatsuka-volley-v1';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now()+Math.floor(Math.random()*100000);let setupModal=null;let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data){let old;try{old=JSON.parse(localStorage.getItem(OLD))}catch{}data=old?{players:old.players.map(p=>({...p,team:'女子'})),matches:old.matches.map(m=>({...m,team:'女子',sets:[{ours:0,theirs:0}],set:1,lineup:[],events:m.events.map(e=>({...e,set:1}))})),current:old.current}: {players:[],matches:[],current:null};}data.players??=[];data.matches??=[];let tab='record',selected=null,skill='サーブ',reportId=null,team='女子',pendingScore=null,pendingReason=null,pendingCategory=null;const skills=['サーブ','レシーブ','トス','アタック','ブロック','ディグ'];const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));window.queueCloudSave?.()}catch{alert('保存できませんでした。端末の保存容量を確認してください。')}};const match=()=>data.matches.find(m=>m.id===data.current);const player=id=>data.players.find(p=>String(p.id)===String(id));const roster=()=>data.players.filter(p=>(p.team||'女子')===team);const btn=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;const safeName=id=>{let p=player(id);return p?`#${esc(p.number)} ${esc(p.name)}`:'登録解除選手'};function draw(){let m=match();$('tabs').innerHTML=[['record','🏐 記録'],['report','📊 分析'],['players','👥 選手'],['history','🗂 履歴']].map(([k,v])=>btn(v,`tab='${k}';draw()`,tab===k?'on':'')).join('');$('app').innerHTML=tab==='record'?recordPage(m):tab==='report'?reportPage():tab==='players'?playersPage():historyPage();let overlay=$('scoreModalRoot');if(overlay)overlay.innerHTML=setupModal?setupModalHtml(m):scoreModal(m);document.body.classList.toggle('modal-open',!!setupModal||!!pendingScore&&tab==='record');}
function scoreModal(m){if(!pendingScore||tab!=='record'||!m)return '';let eligible=data.players.filter(p=>(p.team||'女子')===m.team);return `<div class="score-modal-backdrop" onclick="closeScoreModal()" role="presentation"><section class="score-modal" role="dialog" aria-modal="true" aria-label="得点・失点の記録" onclick="event.stopPropagation()"><div class="score-modal-head"><strong>${pendingScore==='ours'?'🏐 七塚の得点':'🏐 相手の得点'}</strong>${btn('✕ 閉じる','closeScoreModal()')}</div><div class="score-modal-body"><h2>得点・失点を記録</h2>${pendingScore?pendingCategory===null?`<p><b>${pendingScore==='ours'?'七塚の得点':'相手の得点'}</b>：① プレーを選択</p><div class="grid2">${Object.keys(pointCategories[pendingScore]).map((cat,i)=>btn(esc(cat),`choosePointCategory(${i})`)).join('')}</div>`:pendingReason===null?`<p><b>② 詳細を選択：</b>${esc(pendingCategory)}</p><div class="grid2">${pointCategories[pendingScore][pendingCategory].map((reason,i)=>btn(esc(reason),`scoreWithReason(${i})`)).join('')}</div><p>${btn('← プレーに戻る','pendingCategory=null;draw()')}</p>`:`<p><b>③ 誰のプレー？</b>　${esc(pendingReason)}</p><div class="grid3">${serveOnlyReason(pendingReason)?(m.serving==='ours'&&currentServer(m)!=null?btn(safeName(currentServer(m))+'（現在のサーバー）',`scoreWithPlayer(${JSON.stringify(currentServer(m))})`,'primary'):'<p class="hint">七塚のサーバーを特定できません。サーブ権と位置1の選手を設定してください。</p>'):opponentServeReason(pendingReason)?'<p class="hint">相手チームのサーブです。七塚の選手は選択しません。</p>':eligible.filter(p=>m.lineup.includes(p.id)).map(p=>btn('#'+esc(p.number)+' '+esc(p.name),`scoreWithPlayer(${JSON.stringify(p.id)})`)).join('')}</div>${serveOnlyReason(pendingReason)?'':`<p class="muted">相手のプレー・特定できない場合</p><div class="grid2">${btn('相手選手',"scoreWithPlayer(null,'相手選手')")}${btn('不明・該当なし',"scoreWithPlayer(null,'不明')")}</div>`}<p>${btn('← 詳細に戻る','pendingReason=null;draw()')}</p>`:`<p class="muted">上の「＋1点」から、プレー → 詳細 → 選手の順で記録できます。</p>`}${pendingScore?`<p style="margin-top:10px">${btn('キャンセル','pendingScore=null;pendingCategory=null;pendingReason=null;draw()')}</p>`:''}</div></section></div>`}
function closeScoreModal(){pendingScore=null;pendingCategory=null;pendingReason=null;draw()}
function setFinished(m){let s=m.sets[m.set-1]||{ours:0,theirs:0},target=m.set===3?15:21;return Math.max(s.ours,s.theirs)>=target&&Math.abs(s.ours-s.theirs)>=2}
function courtChangeDue(m){let s=m.sets[2];return m.set===3&&s&&!m.courtChanged&&Math.max(s.ours,s.theirs)>=8}
function markCourtChange(){let m=match();if(!m)return;m.courtChanged=true;persist();draw()}
function openSetup(kind,index=null){setupModal={kind,index};draw()}
function closeSetup(){setupModal=null;draw()}
function setupModalHtml(m){if(!m||!setupModal)return '';let eligible=data.players.filter(p=>(p.team||'女子')===m.team),kind=setupModal.kind,idx=setupModal.index,locked=serveLocked(m);let body='';
if(kind==='lineup'){body=`<h2>出場する6人を選択</h2><p class="muted">名前を押した順番がそのままサーブ1〜6番になります。もう一度押すと解除できます。</p><div class="grid3">${eligible.map(p=>btn((m.lineup.includes(p.id)?((m.serveOrder||[]).indexOf(p.id)+1)+'番 ':'')+'#'+esc(p.number)+' '+esc(p.name),`toggleLineup(${JSON.stringify(p.id)})`,m.lineup.includes(p.id)?'primary':'')).join('')}</div><p><b>サーブ順：</b>${(m.serveOrder||[]).filter(x=>x!=null).map((id,i)=>(i+1)+'番 '+safeName(id)).join(' → ')||'未設定'}</p><p>${m.lineup.filter(x=>x!=null).length} / 6人</p>${btn('完了','closeSetup()','primary')}`}
if(kind==='order'){body=`<h2>サーブ順を決める</h2><p class="muted">${locked?'得点記録後は順番を変更できません。':'1番から順番に選手をタップ。途中で戻す場合は最後の選手を解除します。'}</p><div class="grid2">${[0,1,2,3,4,5].map(i=>`<div class="hint"><b>${i+1}番</b>　${safeNameOrEmpty((m.serveOrder||[])[i])}</div>`).join('')}</div><div class="grid3">${m.lineup.filter(x=>x!=null).map(id=>btn(safeName(id),`appendServeOrder(${JSON.stringify(id)})`,(m.serveOrder||[]).includes(id)?'primary':'')).join('')}</div>${locked?'':btn('最後の1人を戻す','popServeOrder()')}`}
if(kind==='sub'){let old=m.lineup[idx];body=`<h2>選手交代</h2><p>交代する選手：<b>${safeNameOrEmpty(old)}</b></p><div class="grid2">${eligible.filter(p=>!m.lineup.includes(p.id)).map(p=>btn('#'+esc(p.number)+' '+esc(p.name),`replaceLineup(${idx},${JSON.stringify(p.id)})`)).join('')}</div>`}
return `<div class="score-modal-backdrop" onclick="closeSetup()"><section class="score-modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="score-modal-head"><strong>🏐 ${kind==='order'?'サーブ順':kind==='sub'?'選手交代':'出場選手'}の設定</strong>${btn('✕ 閉じる','closeSetup()')}</div><div class="score-modal-body">${body}</div></section></div>`}
function toggleLineup(id){let m=match();if(!m)return;if(serveLocked(m))return alert('試合中の変更は選手交代から行ってください');let chosen=(m.serveOrder||[]).filter(x=>x!=null);if(chosen.includes(id)){chosen=chosen.filter(x=>x!==id)}else{if(chosen.length>=6)return alert('6人までです');chosen.push(id)}m.serveOrder=[...chosen,...Array(6-chosen.length).fill(null)];m.lineup=[...chosen,...Array(6-chosen.length).fill(null)];m.serveIndex=0;m.hasServed=false;persist();draw()}
function appendServeOrder(id){let m=match();if(!m||serveLocked(m))return;if(!m.lineup.includes(id))return;let order=m.serveOrder||Array(6).fill(null);if(order.includes(id))return;let i=order.indexOf(null);if(i<0)return;m.serveOrder=[...order];m.serveOrder[i]=id;persist();draw()}
function popServeOrder(){let m=match();if(!m||serveLocked(m))return;let i=(m.serveOrder||[]).findLastIndex(x=>x!=null);if(i>=0)m.serveOrder[i]=null;persist();draw()}
function replaceLineup(i,id){let m=match(),old=m.lineup[i];if(!old||m.lineup.includes(id))return;assignPosition(i+1,String(id));closeSetup()}
function recordPage(m){let eligible=data.players.filter(p=>(p.team||'女子')===(m?.team||team));return `<section class="card"><h2>試合設定</h2><div class="row"><label>チーム <select id="team" onchange="team=this.value;draw()"><option ${team==='女子'?'selected':''}>女子</option><option ${team==='男子'?'selected':''}>男子</option></select></label><input id="opponent" placeholder="対戦相手" style="flex:1" value=""><button class="primary" onclick="startMatch()">新規試合</button></div>${m?`<p class="muted">${esc(m.team)} vs ${esc(m.opponent)} ／ ${esc(m.date)}</p>`:''}</section>${m?`<section class="card"><div class="score"><div><div class="label">七塚</div><strong>${m.sets[m.set-1]?.ours||0}</strong>${btn('＋1点',"chooseScore('ours')",'primary')}${btn('－1点',"undoScore('ours')")}</div><div><b>第${m.set}セット</b><p class="muted">${m.set===3?'15点':'21点'}・2点差</p>${btn('次のセット','nextSet()')}</div><div><div class="label">${esc(m.opponent)}</div><strong>${m.sets[m.set-1]?.theirs||0}</strong>${btn('＋1点',"chooseScore('theirs')")}${btn('－1点',"undoScore('theirs')")}</div></div>${setFinished(m)?`<p class="hint"><b>🏁 第${m.set}セット終了（${m.sets[m.set-1].ours}－${m.sets[m.set-1].theirs}）</b></p>`:courtChangeDue(m)?`<p class="hint"><b>🔄 8点到達・コートチェンジ！</b> ${btn('チェンジ完了','markCourtChange()','primary')}</p>`:''}<div class="row" style="justify-content:center;margin-top:8px">${btn('↶ 最後の操作を取消','undo()')}</div></section><section class="card"><div class="row" style="justify-content:space-between"><b>出場選手・サーブ順</b>${btn('6人を設定',"openSetup('lineup')")}${btn('サーブ順',"openSetup('order')")}</div><p class="muted">出場：${m.lineup.filter(x=>x!=null).map(id=>safeName(id)).join('・')||'未設定'}</p><p><b>サーブ：${m.serving==='ours'?'七塚（'+safeNameOrEmpty(currentServer(m))+'）':m.serving==='theirs'?'相手':'未設定'}</b></p><div class="row">${btn('七塚からサーブ',"setServing('ours')",m.serving==='ours'?'primary':'')}${btn('相手からサーブ',"setServing('theirs')",m.serving==='theirs'?'primary':'')}</div><p class="muted">サーブ順：${(m.serveOrder||[]).map(x=>safeNameOrEmpty(x)).join(' → ')}</p><div class="row">${m.lineup.filter(x=>x!=null).map(id=>btn('交代 '+safeName(id),`openSetup('sub',${m.lineup.indexOf(id)})`)).join('')}</div></section><section class="card"><h2>直近の得点記録</h2>${(m.pointEvents||[]).slice(-5).reverse().map(e=>`<div class="log">第${e.set}セット ${e.side==='ours'?'七塚':'相手'}＋1 ／ ${esc(e.reason||'不明')} ／ ${e.playerId!=null?safeName(e.playerId):esc(e.actor||'不明')}</div>`).join('')||'<p class="muted">まだ記録はありません</p>'}</section>`:''}`}
function playersPage(){return `<section class="card"><h2>選手登録</h2><div class="row"><select id="pteam"><option>女子</option><option>男子</option></select><input id="pnum" type="number" min="0" placeholder="背番号" style="width:90px"><input id="pname" placeholder="選手名" style="flex:1"><button class="primary" onclick="addPlayer()">追加</button></div><p class="muted">最初に選手を登録してください。データのない選手名は自動補完しません。</p></section>${['女子','男子'].map(t=>`<section class="card"><h2>${t}（${data.players.filter(p=>p.team===t).length}名）</h2>${data.players.filter(p=>p.team===t).map(p=>`<div class="log row" style="justify-content:space-between"><span>${safeName(p.id)}</span>${btn('登録解除',`removePlayer(${JSON.stringify(p.id)})`)}</div>`).join('')||'<p class="muted">未登録</p>'}</section>`).join('')}`}
function reportPage(){let m=data.matches.find(x=>x.id===reportId)||match()||data.matches.at(-1);if(!m)return '<section class="card">まだ試合データがありません。</section>';let points=m.pointEvents||[],receives=points.filter(e=>e.reason?.startsWith('サーブレシーブミス（'));let types=['前に落ちた','下がりながら','サイド','その他'];let byPlayer={};for(let e of receives){let id=e.playerId??'unknown';byPlayer[id]??={total:0,types:Object.fromEntries(types.map(t=>[t,0]))};byPlayer[id].total++;for(let t of types)if(e.reason.includes('（'+t+'）'))byPlayer[id].types[t]++}let legacy={};for(let e of (m.events||[])){let key=e.playerId+'|'+e.skill;legacy[key]??={count:0,good:0,miss:0};legacy[key].count++;if(e.result==='成功')legacy[key].good++;if(e.result==='ミス')legacy[key].miss++}let reasonTotals={};for(let e of points)reasonTotals[e.reason||'理由未記録']=(reasonTotals[e.reason||'理由未記録']||0)+1;return `<section class="card"><h2>試合・選手別分析</h2><select class="wide" onchange="reportId=Number(this.value);draw()">${data.matches.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.date)} ${esc(x.team)} vs ${esc(x.opponent)}</option>`).join('')}</select><p><b>得点・失点記録 ${points.length}件</b> ／ 第${m.set}セットまで</p><h2>サーブレシーブミス（方向別）</h2><p class="muted">相手サーブに対するレシーブミスの内訳。記録数であり、成功率ではありません。</p><div class="scroll"><table><thead><tr><th>選手</th><th>前</th><th>後ろ</th><th>左右</th><th>その他</th><th>合計</th></tr></thead><tbody>${Object.entries(byPlayer).sort((a,b)=>b[1].total-a[1].total).map(([id,v])=>`<tr><td>${id==='unknown'?'不明':safeName(id)}</td><td>${v.types['前に落ちた']}</td><td>${v.types['下がりながら']}</td><td>${v.types['サイド']}</td><td>${v.types['その他']}</td><td><b>${v.total}</b></td></tr>`).join('')||'<tr><td colspan="6">まだ記録がありません</td></tr>'}</tbody></table></div><h2>得失点理由の内訳</h2><div class="scroll"><table><thead><tr><th>理由</th><th>回数</th></tr></thead><tbody>${Object.entries(reasonTotals).sort((a,b)=>b[1]-a[1]).map(([reason,count])=>`<tr><td>${esc(reason)}</td><td>${count}</td></tr>`).join('')||'<tr><td colspan="2">まだ記録がありません</td></tr>'}</tbody></table></div>${Object.keys(legacy).length?`<h2>旧プレー記録の集計</h2><div class="scroll"><table><thead><tr><th>選手</th><th>プレー</th><th>記録</th><th>成功</th><th>ミス</th></tr></thead><tbody>${Object.entries(legacy).map(([key,v])=>{let [id,skill]=key.split('|');return `<tr><td>${safeName(id)}</td><td>${esc(skill)}</td><td>${v.count}</td><td>${v.good}</td><td>${v.miss}</td></tr>`}).join('')}</tbody></table></div>`:''}<p class="muted">得点・失点だけの記録では全プレーの試行回数が不明なため、成功率は表示しません。動画分析で補完してください。</p><div class="row">${btn('CSV出力',`exportCSV(${m.id})`,'primary')}${btn('JSONバックアップ','backup()')}</div></section>`}
function historyPage(){return `<section class="card"><h2>試合履歴</h2>${data.matches.slice().reverse().map(m=>`<div class="log"><b>${esc(m.date)} ${esc(m.team)} vs ${esc(m.opponent)}</b><div class="row" style="margin-top:7px">${btn('記録を再開',`openMatch(${m.id})`)}${btn('分析',`reportId=${m.id};tab='report';draw()`)}${btn('削除',`deleteMatch(${m.id})`,'danger')}</div></div>`).join('')||'<p>履歴はありません。</p>'}</section><section class="card"><h2>データ管理</h2><div class="row">${btn('全データをバックアップ','backup()','primary')}<label class="pill">JSON復元 <input type="file" accept="application/json,.json" onchange="restore(this.files[0])" style="max-width:190px"></label></div><p class="muted">データはこのブラウザ内に保存されます。端末変更・履歴削除に備えて定期的にバックアップしてください。</p></section>`}
function addPlayer(){let name=$('pname').value.trim(),number=$('pnum').value.trim(),t=$('pteam').value;if(!name||!number)return alert('名前と背番号を入力してください');if(data.players.some(p=>p.team===t&&String(p.number)===number))return alert('同じチームに同じ背番号が登録されています');data.players.push({id:uid(),name,number,team:t});persist();draw()}
function removePlayer(id){if(!confirm('登録解除しますか？過去の記録は残ります。'))return;data.players=data.players.filter(p=>p.id!==id);persist();draw()}
function startMatch(){let name=$('opponent').value.trim();if(!name)return alert('対戦相手を入力してください');if(!data.players.some(p=>p.team===team))return alert('先に「選手」で選手を登録してください');let m={id:uid(),team,opponent:name,date:new Date().toLocaleDateString('ja-JP'),set:1,sets:[{ours:0,theirs:0}],lineup:[null,null,null,null,null,null],events:[],actions:[],serveOrder:[null,null,null,null,null,null],serveIndex:0,hasServed:false,substitutions:[]};data.matches.push(m);data.current=m.id;selected=null;pendingScore=null;pendingCategory=null;pendingReason=null;persist();draw()}
function setLineup(){let m=match();if(!m)return;document.getElementById('lineupEditor')?.scrollIntoView({behavior:'smooth',block:'center'})}
function serveLocked(m){return (m.pointEvents||[]).some(e=>e.set===m.set)}
function safeNameOrEmpty(id){return id==null?'未設定':safeName(id)}
function currentServer(m){return (m.serveOrder||[])[m.serveIndex||0]??null}
function setServeOrder(i,value){let m=match();if(!m||serveLocked(m))return alert('試合開始後はサーブ順を変更できません');let id=value===''?null:Number(value);if(id!=null&&!m.lineup.includes(id))return alert('コート上の選手を選んでください');let order=[...(m.serveOrder||Array(6).fill(null))];if(id!=null&&order.some((x,j)=>j!==i&&String(x)===String(id)))return alert('同じ選手を2回登録できません');order[i]=id;m.serveOrder=order;persist();draw()}
function assignPosition(pos,value){let m=match();if(!m)return;let id=value===''?null:Number(value);if(id!=null&&!data.players.some(p=>p.id===id&&p.team===m.team))return alert('選手が見つかりません');if(id!=null&&m.lineup.some((x,i)=>i!==pos-1&&String(x)===String(id)))return alert('すでに別の位置にいる選手です');let old=m.lineup[pos-1];if(String(old)===String(id))return;if(serveLocked(m)&&old!=null&&id==null)return alert('試合中は交代する選手を選択してください');m.actions??=[];m.actions.push({type:'substitution',prevLineup:[...m.lineup],prevOrder:[...(m.serveOrder||[])],prevSubCount:(m.substitutions||[]).length});m.lineup[pos-1]=id;if(!serveLocked(m)){m.serveOrder??=Array(6).fill(null);m.serveOrder=m.serveOrder.map(x=>x===old?id:x)}else{m.substitutions??=[];m.substitutions.push({set:m.set,pos,outId:old,inId:id,time:new Date().toISOString()});m.serveOrder=(m.serveOrder||[]).map(x=>x===old?id:x)}selected=null;persist();draw()}
function substitutePosition(pos){let m=match();if(!m)return;let available=data.players.filter(p=>p.team===m.team);let options=available.map(p=>p.number+':'+p.name).join(' / ');let num=prompt('位置'+pos+'の交代選手の背番号を入力してください。\n'+options);if(num===null)return;let p=available.find(p=>String(p.number)===num.trim());if(!p)return alert('背番号が見つかりません');assignPosition(pos,String(p.id))}
function chooseSkill(s){skill=s;draw()}
function addEvent(result){let m=match();if(selected==null)return alert('先にコート上の選手を選んでください');m.actions??=[];m.events.push({playerId:selected,skill,result,set:m.set,time:new Date().toISOString()});m.actions.push({type:'event'});persist();draw()}
const pointCategories={ours:{'サーブ':['サーブエース'],'レシーブ':['相手のレシーブミス'],'アタック':['アタック決定','フェイント決定','相手のアタックミス（ネット）','相手のアタックミス（アウト）'],'ブロック':['ブロック決定'],'トス・つなぎ':['相手のトス・つなぎミス'],'反則・その他':['相手の反則','その他・不明']},theirs:{'サーブ':['七塚のサーブミス（ネット）','七塚のサーブミス（アウト）','相手のサーブエース'],'サーブレシーブ':['サーブレシーブミス（前に落ちた）','サーブレシーブミス（下がりながら）','サーブレシーブミス（サイド）','サーブレシーブミス（その他）'],'レシーブ':['七塚のレシーブミス（オーバー）','七塚のレシーブミス（アンダー）','七塚のレシーブミス（触れずに失点）'],'アタック':['七塚のアタックミス（ネット）','七塚のアタックミス（アウト）','相手のアタック決定','相手のフェイント決定'],'ブロック':['七塚のアタックがブロックされた','相手のブロック決定'],'トス・つなぎ':['七塚のトスミス','七塚のつなぎミス'],'反則・その他':['七塚の反則','その他・不明']}};function serveOnlyReason(reason){return reason==='サーブエース'||reason?.startsWith('七塚のサーブミス')}function opponentServeReason(reason){return reason?.startsWith('相手のサーブ')}function setServing(side){let m=match();if(!m)return;if(serveLocked(m))return alert('試合中のサーブ権は得点に合わせて自動で切り替わります');m.actions??=[];m.actions.push({type:'serveSetting',prev:m.serving??null});m.serving=side;persist();draw()}function chooseScore(side){let m=match();if(setFinished(m))return alert('このセットは終了しています。次のセットへ進んでください');if(courtChangeDue(m))return alert('8点到達です。先にコートチェンジ完了を押してください');pendingScore=side;pendingCategory=null;pendingReason=null;draw()}function choosePointCategory(index){if(!pendingScore)return;pendingCategory=Object.keys(pointCategories[pendingScore])[index]||null;pendingReason=null;draw()}function scoreWithReason(index){if(!pendingScore||!pendingCategory)return;pendingReason=pointCategories[pendingScore][pendingCategory][index]||null;if(pendingScore==='ours'&&match()?.serving==='ours'&&pendingReason==='相手のレシーブミス'){scoreWithPlayer(null,'相手のレシーブミス');return}draw()}function scoreWithPlayer(id,actor){if(!pendingScore||!pendingReason)return;if(serveOnlyReason(pendingReason)){let m=match();if(m.serving!=='ours'||currentServer(m)==null||String(id)!==String(currentServer(m)))return alert('現在のサーバーだけ選択できます。サーブ権と位置1を確認してください。')}if(opponentServeReason(pendingReason)&&id!=null)return alert('相手のサーブは七塚の選手に割り当てられません');const side=pendingScore,reason=pendingReason;pendingScore=null;pendingCategory=null;pendingReason=null;score(side,1,reason,id,actor)}
function score(side,delta,reason='理由未記録',playerId=null,actor='不明'){let m=match();if(setFinished(m))return alert('セットは終了しています');if(courtChangeDue(m))return alert('先にコートチェンジを完了してください');if(!m.serving)return alert('最初のサーブ権を設定してください');if((m.serveOrder||[]).filter(x=>x!=null).length!==6)return alert('6人のサーブ順を設定してください');m.actions??=[];m.pointEvents??=[];const prevServing=m.serving,prevServeIndex=m.serveIndex||0,prevHasServed=!!m.hasServed;if(m.serving!==side){if(side==='ours'&&m.hasServed)m.serveIndex=((m.serveIndex||0)+1)%6;m.serving=side}if(side==='ours')m.hasServed=true;m.sets[m.set-1][side]+=delta;const point={set:m.set,side,reason,playerId,actor:playerId!=null?'七塚選手':actor,time:new Date().toISOString()};m.pointEvents.push(point);m.actions.push({type:'score',set:m.set,side,point,prevServing,prevServeIndex,prevHasServed});persist();draw()}
function undoScore(k){let m=match();if(!m||!['ours','theirs'].includes(k))return;let s=m.sets[m.set-1];if(!s||s[k]<=0)return;m.actions??=[];m.pointEvents??=[];let ix=m.pointEvents.findLastIndex(e=>e.set===m.set&&e.side===k);let removed=ix>=0?m.pointEvents.splice(ix,1)[0]:null;let prevServing=m.serving??null,prevLineup=[...m.lineup],prevServeIndex=m.serveIndex||0,prevHasServed=!!m.hasServed;let actionIndex=m.actions.findLastIndex(a=>a.type==='score'&&a.set===m.set&&a.side===k&&(!removed||a.point?.time===removed.time));let original=actionIndex>=0?m.actions[actionIndex]:null;let latestPoint=m.actions.findLastIndex(a=>a.type==='score'&&a.set===m.set);let safeRestore=!!original&&actionIndex===latestPoint&&m.actions.slice(actionIndex+1).every(a=>a.type==='event');if(safeRestore){m.serving=original.prevServing??null;m.serveIndex=original.prevServeIndex??0;m.hasServed=!!original.prevHasServed}s[k]--;m.actions.push({type:'scoreCorrection',set:m.set,side:k,removed,pointIndex:ix,prevServing,prevLineup,prevServeIndex,prevHasServed});persist();draw();if(original&&!safeRestore)alert('過去の得点を修正しました。サーブ順を確認してください。')}
function nextSet(){let m=match();if(m.set>=3)return alert('第3セットまでです');if(!setFinished(m)&&!confirm('セット終了点に達していません。次のセットに進みますか？'))return;if(setFinished(m)&&!confirm('次のセットを開始しますか？'))return;m.actions??=[];m.actions.push({type:'set',prev:m.set,prevServing:m.serving??null,prevServeIndex:m.serveIndex||0,prevHasServed:!!m.hasServed,prevOrder:[...(m.serveOrder||[])]});m.set++;m.sets[m.set-1]??={ours:0,theirs:0};m.serving=null;m.serveIndex=0;m.hasServed=false;m.serveOrder=Array(6).fill(null);m.courtChanged=false;persist();draw()}
function undo(){let m=match();if(!m)return;m.actions??=[];let a=m.actions.pop();if(!a)return alert('取り消す操作がありません');if(a.type==='event')m.events.pop();if(a.type==='score'){m.serving=a.prevServing??null;m.serveIndex=a.prevServeIndex??0;m.hasServed=!!a.prevHasServed;m.sets[a.set-1][a.side]=Math.max(0,m.sets[a.set-1][a.side]-1);if(a.point){m.pointEvents??=[];let i=m.pointEvents.findIndex(e=>e.time===a.point.time&&e.side===a.point.side);if(i>=0)m.pointEvents.splice(i,1)}}if(a.type==='scoreCorrection'){if(a.prevLineup)m.lineup=[...a.prevLineup];m.serving=a.prevServing??null;m.serveIndex=a.prevServeIndex??0;m.hasServed=!!a.prevHasServed;m.sets[a.set-1][a.side]++;if(a.removed){m.pointEvents??=[];m.pointEvents.splice(Math.max(0,a.pointIndex),0,a.removed)}}if(a.type==='lineup')m.lineup=a.prev;if(a.type==='set'){m.set=a.prev;m.courtChanged=false;m.serving=a.prevServing??null;m.serveIndex=a.prevServeIndex??0;m.hasServed=!!a.prevHasServed;m.serveOrder=a.prevOrder||Array(6).fill(null)}if(a.type==='serveSetting')m.serving=a.prev;if(a.type==='substitution'){m.lineup=a.prevLineup;m.serveOrder=a.prevOrder;m.substitutions=(m.substitutions||[]).slice(0,a.prevSubCount)}persist();draw()}
function openMatch(id){data.current=id;selected=null;pendingScore=null;pendingCategory=null;pendingReason=null;tab='record';persist();draw()}
function deleteMatch(id){if(!confirm('この試合と記録を完全に削除しますか？'))return;data.matches=data.matches.filter(m=>m.id!==id);if(data.current===id)data.current=data.matches.at(-1)?.id||null;persist();draw()}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(id){let m=data.matches.find(x=>x.id===id);if(!m)return;let rows=[['日付','チーム','対戦相手','セット','時刻','得失点','背番号','選手','プレー・理由','結果']];for(let e of (m.pointEvents||[])){let p=player(e.playerId);rows.push([m.date,m.team,m.opponent,e.set,e.time,e.side==='ours'?'得点':'失点',p?.number||'',p?.name||e.actor||'不明',e.reason||'',e.side==='ours'?'＋1':'－1'])}for(let e of (m.events||[])){let p=player(e.playerId);rows.push([m.date,m.team,m.opponent,e.set,e.time,'旧プレー記録',p?.number||'',p?.name||'不明',e.skill,e.result])}download('volley_'+m.id+'.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('volley_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,...data},null,2),'application/json')}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw Error('形式が違います');if(!confirm('現在のデータをバックアップファイルの内容で上書きしますか？'))return;data={players:d.players,matches:d.matches,current:d.current??null};persist();selected=null;draw();alert('復元しました')}catch(e){alert('復元できません：'+e.message)}}draw();
