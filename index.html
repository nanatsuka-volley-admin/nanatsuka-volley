'use strict';const KEY='nanatsuka-volley-v2',OLD='nanatsuka-volley-v1';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now()+Math.floor(Math.random()*100000);let setupModal=null;let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data){let old;try{old=JSON.parse(localStorage.getItem(OLD))}catch{}data=old?{players:old.players.map(p=>({...p,team:'女子'})),matches:old.matches.map(m=>({...m,team:'女子',sets:[{ours:0,theirs:0}],set:1,lineup:[],events:m.events.map(e=>({...e,set:1}))})),current:old.current}: {players:[],matches:[],current:null};}data.players??=[];data.matches??=[];let tab='record',selected=null,skill='サーブ',reportId=null,team='女子',pendingScore=null,pendingReason=null,pendingCategory=null;const skills=['サーブ','レシーブ','トス','アタック','ブロック','ディグ'];const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));window.queueCloudSave?.()}catch{alert('保存できませんでした。端末の保存容量を確認してください。')}};const match=()=>data.matches.find(m=>m.id===data.current);const player=id=>data.players.find(p=>String(p.id)===String(id));const roster=()=>data.players.filter(p=>(p.team||'女子')===team);const btn=(label,fn,cl='')=>`<button class="${cl}" onclick="${String(fn).replaceAll('&','&amp;').replaceAll('"','&quot;')}">${label}</button>`;const safeName=id=>{let p=player(id);return p?esc(p.name):'登録解除選手'};function draw(){let m=match();$('tabs').innerHTML=[['record','🏐 記録'],['report','📊 分析'],['players','👥 選手'],['history','🗂 履歴']].map(([k,v])=>btn(v,`tab='${k}';draw()`,tab===k?'on':'')).join('');$('app').innerHTML=tab==='record'?recordPage(m):tab==='report'?reportPage():tab==='players'?playersPage():historyPage();let overlay=$('scoreModalRoot');if(overlay)overlay.innerHTML=setupModal?setupModalHtml(m):scoreModal(m);document.body.classList.toggle('modal-open',!!setupModal||!!pendingScore&&tab==='record');}
function scoreModal(m){if(!pendingScore||tab!=='record'||!m)return '';let eligible=data.players.filter(p=>(p.team||'女子')===m.team);return `<div class="score-modal-backdrop" onclick="closeScoreModal()" role="presentation"><section class="score-modal" role="dialog" aria-modal="true" aria-label="得点・失点の記録" onclick="event.stopPropagation()"><div class="score-modal-head"><strong>${pendingScore==='ours'?'🏐 七塚の得点':'🏐 相手の得点'}</strong>${btn('✕ 閉じる','closeScoreModal()')}</div><div class="score-modal-body"><h2>得点・失点を記録</h2>${pendingScore?pendingCategory===null?`<p><b>${pendingScore==='ours'?'七塚の得点':'相手の得点'}</b>：① プレーを選択</p><div class="grid2">${availableCategories(m,pendingScore).map(cat=>btn(esc(cat),`choosePointCategoryByName(${JSON.stringify(cat)})`)).join('')}</div>`:pendingReason===null?`<p><b>② 詳細を選択：</b>${esc(pendingCategory)}</p><div class="grid2">${availableReasons(m,pendingScore,pendingCategory).map(reason=>btn(esc(shortReason(reason)),`scoreWithReasonByName(${JSON.stringify(reason)})`)).join('')}</div><p>${btn('← プレーに戻る','pendingCategory=null;draw()')}</p>`:`<p><b>③ 誰のプレー？</b>　${esc(pendingReason)}</p><div class="grid3">${serveOnlyReason(pendingReason)?(m.serving==='ours'&&currentServer(m)!=null?btn(safeName(currentServer(m))+'（現在のサーバー）',`scoreWithPlayer(${JSON.stringify(currentServer(m))})`,'primary'):'<p class="hint">七塚のサーバーを特定できません。サーブ権と位置1の選手を設定してください。</p>'):opponentServeReason(pendingReason)?'<p class="hint">相手チームのサーブです。七塚の選手は選択しません。</p>':eligible.filter(p=>m.lineup.includes(p.id)).map(p=>btn(esc(p.name),`scoreWithPlayer(${JSON.stringify(p.id)})`)).join('')}</div>${serveOnlyReason(pendingReason)?'':`<p class="muted">相手のプレー・特定できない場合</p><div class="grid2">${btn('相手選手',"scoreWithPlayer(null,'相手選手')")}${btn('不明・該当なし',"scoreWithPlayer(null,'不明')")}</div>`}<p>${btn('← 詳細に戻る','pendingReason=null;draw()')}</p>`:`<p class="muted">上の「＋1点」から、プレー → 詳細 → 選手の順で記録できます。</p>`}${pendingScore?`<p style="margin-top:10px">${btn('キャンセル','pendingScore=null;pendingCategory=null;pendingReason=null;draw()')}</p>`:''}</div></section></div>`}
function closeScoreModal(){pendingScore=null;pendingCategory=null;pendingReason=null;draw()}
function setFinished(m){let s=m.sets[m.set-1]||{ours:0,theirs:0},target=m.set===3?15:21;return Math.max(s.ours,s.theirs)>=target&&Math.abs(s.ours-s.theirs)>=2}
function courtChangeDue(m){let s=m.sets[2];return m.set===3&&s&&!m.courtChanged&&Math.max(s.ours,s.theirs)>=8}
function markCourtChange(){let m=match();if(!m)return;m.courtChanged=true;persist();draw()}

function setupModalHtml(m){if(!m||!setupModal)return '';let eligible=data.players.filter(p=>(p.team||'女子')===m.team),kind=setupModal.kind,idx=setupModal.index,locked=serveLocked(m);let body='';
if(kind==='lineup'){body=`<h2>出場する6人を選択</h2><p class="muted">名前を押した順番がそのままサーブ1〜6番になります。もう一度押すと解除できます。</p><div class="grid3">${eligible.map(p=>btn((m.lineup.includes(p.id)?((m.serveOrder||[]).indexOf(p.id)+1)+'番 ':'')+'#'+esc(p.number)+' '+esc(p.name),`toggleLineup(${JSON.stringify(p.id)})`,m.lineup.includes(p.id)?'primary':'')).join('')}</div><p><b>サーブ順：</b>${(m.serveOrder||[]).filter(x=>x!=null).map((id,i)=>(i+1)+'番 '+safeName(id)).join(' → ')||'未設定'}</p><p>${m.lineup.filter(x=>x!=null).length} / 6人</p>${btn('完了','closeSetup()','primary')}`}
if(kind==='order'){body=`<h2>サーブ順を決める</h2><p class="muted">${locked?'得点記録後は順番を変更できません。':'1番から順番に選手をタップ。途中で戻す場合は最後の選手を解除します。'}</p><div class="grid2">${[0,1,2,3,4,5].map(i=>`<div class="hint"><b>${i+1}番</b>　${safeNameOrEmpty((m.serveOrder||[])[i])}</div>`).join('')}</div><div class="grid3">${m.lineup.filter(x=>x!=null).map(id=>btn(safeName(id),`appendServeOrder(${JSON.stringify(id)})`,(m.serveOrder||[]).includes(id)?'primary':'')).join('')}</div>${locked?'':btn('最後の1人を戻す','popServeOrder()')}`}
if(kind==='sub'){let old=m.lineup[idx];body=`<h2>選手交代</h2><p>交代する選手：<b>${safeNameOrEmpty(old)}</b></p><div class="grid2">${eligible.filter(p=>!m.lineup.includes(p.id)).map(p=>btn('#'+esc(p.number)+' '+esc(p.name),`replaceLineup(${idx},${JSON.stringify(p.id)})`)).join('')}</div>`}
return `<div class="score-modal-backdrop" onclick="closeSetup()"><section class="score-modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="score-modal-head"><strong>🏐 ${kind==='order'?'サーブ順':kind==='sub'?'選手交代':'出場選手'}の設定</strong>${btn('✕ 閉じる','closeSetup()')}</div><div class="score-modal-body">${body}</div></section></div>`}
function toggleLineup(id){let m=match();if(!m)return;if(serveLocked(m))return alert('試合中の変更は選手交代から行ってください');let chosen=(m.serveOrder||[]).filter(x=>x!=null);if(chosen.includes(id)){chosen=chosen.filter(x=>x!==id)}else{if(chosen.length>=6)return alert('6人までです');chosen.push(id)}m.serveOrder=[...chosen,...Array(6-chosen.length).fill(null)];m.lineup=[...chosen,...Array(6-chosen.length).fill(null)];m.serveIndex=0;m.hasServed=false;persist();draw()}
function appendServeOrder(id){let m=match();if(!m||serveLocked(m))return;if(!m.lineup.includes(id))return;let order=m.serveOrder||Array(6).fill(null);if(order.includes(id))return;let i=order.indexOf(null);if(i<0)return;m.serveOrder=[...order];m.serveOrder[i]=id;persist();draw()}
function popServeOrder(){let m=match();if(!m||serveLocked(m))return;let i=(m.serveOrder||[]).findLastIndex(x=>x!=null);if(i>=0)m.serveOrder[i]=null;persist();draw()}
function replaceLineup(i,id){let m=match(),old=m.lineup[i];if(!old||m.lineup.includes(id))return;assignPosition(i+1,String(id));closeSetup()}
let showNewMatch=false;function toggleNewMatch(){showNewMatch=!showNewMatch;draw()}
function recordPage(m){let eligible=data.players.filter(p=>(p.team||'女子')===(m?.team||team));return `<section class="card">${m?`<div class="row" style="justify-content:space-between"><b>${esc(m.team)} vs ${esc(m.opponent)}</b>${btn("新規試合設定", "toggleNewMatch()")}</div>`:`<h2>試合設定</h2>`}<div id="newMatchFields" style="${m&&!showNewMatch?"display:none":""}"><div class="row"><label>チーム <select id="team" onchange="team=this.value;draw()"><option ${team==='女子'?'selected':''}>女子</option><option ${team==='男子'?'selected':''}>男子</option></select></label><input id="opponent" placeholder="対戦相手" style="flex:1" value=""><button class="primary" onclick="startMatch()">新規試合</button></div></div>${m?`<p class="muted">${esc(m.team)} vs ${esc(m.opponent)} ／ ${esc(m.date)}</p>`:''}</section>${m?`<section class="card"><div class="score"><div><div class="label">七塚</div><strong>${m.sets[m.set-1]?.ours||0}</strong>${btn('＋1点',"chooseScore('ours')",'primary')}${btn('－1点',"undoScore('ours')")}</div><div><b>第${m.set}セット</b><p class="muted">${m.set===3?'15点':'21点'}・2点差</p>${btn('次のセット','nextSet()')}</div><div><div class="label">${esc(m.opponent)}</div><strong>${m.sets[m.set-1]?.theirs||0}</strong>${btn('＋1点',"chooseScore('theirs')")}${btn('－1点',"undoScore('theirs')")}</div></div>${setFinished(m)?`<p class="hint"><b>🏁 第${m.set}セット終了（${m.sets[m.set-1].ours}－${m.sets[m.set-1].theirs}）</b></p>`:courtChangeDue(m)?`<p class="hint"><b>🔄 8点到達・コートチェンジ！</b> ${btn('チェンジ完了','markCourtChange()','primary')}</p>`:''}<div class="row" style="justify-content:center;margin-top:8px">${btn('↶ 最後の操作を取消','undo()')}</div></section><section class="card"><div class="row" style="justify-content:space-between"><b>出場選手・サーブ順</b>${btn('6人を設定',"openSetup('lineup')")}</div><p class="muted">出場：${m.lineup.filter(x=>x!=null).map(id=>safeName(id)).join('・')||'未設定'}</p><p><b>サーブ：${m.serving==='ours'?'七塚（'+safeNameOrEmpty(currentServer(m))+'）':m.serving==='theirs'?'相手':'未設定'}</b></p><div class="row">${btn('七塚からサーブ',"setServing('ours')",m.serving==='ours'?'primary':'')}${btn('相手からサーブ',"setServing('theirs')",m.serving==='theirs'?'primary':'')}</div><details><summary class="muted">サーブ順・交代を確認</summary><p class="muted">サーブ順：${(m.serveOrder||[]).map(x=>safeNameOrEmpty(x)).join(' → ')}</p><div class="row">${m.lineup.filter(x=>x!=null).map(id=>btn('交代 '+safeName(id),`openSetup('sub',${m.lineup.indexOf(id)})`)).join('')}</div></details></section><details class="card"><summary><b>直近の得点記録</b></summary>${(m.pointEvents||[]).slice(-5).reverse().map(e=>`<div class="log">第${e.set}セット ${e.side==='ours'?'七塚':'相手'}＋1 ／ ${esc(e.reason||'不明')} ／ ${e.playerId!=null?safeName(e.playerId):esc(e.actor||'不明')}</div>`).join('')||'<p class="muted">まだ記録はありません</p>'}</details>`:''}`}
function playersPage(){return `<section class="card"><h2>選手登録</h2><p><button class="primary" onclick="document.getElementById('rosterFile').click()">📂 Excel名簿を読み込む</button><input id="rosterFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="importRosterFile(this)"></p><p class="muted">男子名簿・女子名簿から氏名を登録。既存の記録は保持します。</p><div class="row"><select id="pteam"><option>女子</option><option>男子</option></select><input id="pname" placeholder="選手名" style="flex:1"><button class="primary" onclick="addPlayer()">追加</button></div><p class="muted">最初に選手を登録してください。データのない選手名は自動補完しません。</p></section>${['女子','男子'].map(t=>`<section class="card"><h2>${t}（${data.players.filter(p=>p.team===t).length}名）</h2>${data.players.filter(p=>p.team===t).map(p=>`<div class="log row" style="justify-content:space-between"><span>${safeName(p.id)}</span>${btn('登録解除',`removePlayer(${JSON.stringify(p.id)})`)}</div>`).join('')||'<p class="muted">未登録</p>'}</section>`).join('')}`}
function freeAnalysis(points){if(!points.length)return '<p>得失点を記録すると分析を表示します。</p>';let loss=points.filter(e=>e.side==='theirs'),win=points.filter(e=>e.side==='ours'),counts={};for(let e of loss)counts[e.reason||'不明']=(counts[e.reason||'不明']||0)+1;let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];let direction={前:0,後ろ:0,左右:0};for(let e of loss){if(e.reason?.includes('前に落ちた'))direction.前++;if(e.reason?.includes('下がりながら'))direction.後ろ++;if(e.reason?.includes('サイド'))direction.左右++}let streak=0,maxLoss=0;for(let e of points){streak=e.side==='theirs'?streak+1:0;maxLoss=Math.max(maxLoss,streak)}let focus=direction.前>=direction.後ろ&&direction.前>=direction.左右&&direction.前>0?'前方への一歩目と落下点の判断':direction.後ろ>=direction.左右&&direction.後ろ>0?'後方への移動と体勢づくり':direction.左右>0?'左右への一歩目と守備範囲':'失点が多いプレーの再確認';return `<div class="hint"><p>記録得点：${win.length}件 ／ 記録失点：${loss.length}件</p><p>最多失点理由：${esc(top?top[0]:'なし')}（${top?top[1]:0}件）</p><p>最大連続失点：${maxLoss}点</p><p>サーブレシーブミス：前${direction.前}・後ろ${direction.後ろ}・左右${direction.左右}件</p><p><b>次の練習テーマ候補：</b>${esc(focus)}</p></div><p class="muted">記録から自動集計しています。外部AI送信なし・追加料金なし。未記録のプレーは対象外です。</p>`}function reportPage(){let m=data.matches.find(x=>x.id===reportId)||match()||data.matches.at(-1);if(!m)return '<section class="card">まだ試合データがありません。</section>';let points=m.pointEvents||[],receives=points.filter(e=>e.reason?.startsWith('サーブレシーブミス（'));let types=['前に落ちた','下がりながら','サイド','その他'];let byPlayer={};for(let e of receives){let id=e.playerId??'unknown';byPlayer[id]??={total:0,types:Object.fromEntries(types.map(t=>[t,0]))};byPlayer[id].total++;for(let t of types)if(e.reason.includes('（'+t+'）'))byPlayer[id].types[t]++}let legacy={};for(let e of (m.events||[])){let key=e.playerId+'|'+e.skill;legacy[key]??={count:0,good:0,miss:0};legacy[key].count++;if(e.result==='成功')legacy[key].good++;if(e.result==='ミス')legacy[key].miss++}let reasonTotals={};for(let e of points)reasonTotals[e.reason||'理由未記録']=(reasonTotals[e.reason||'理由未記録']||0)+1;return `<section class="card"><h2>試合・選手別分析</h2><select class="wide" onchange="reportId=Number(this.value);draw()">${data.matches.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.date)} ${esc(x.team)} vs ${esc(x.opponent)}</option>`).join('')}</select><p><b>得点・失点記録 ${points.length}件</b> ／ 第${m.set}セットまで</p><h2>✨ 自動試合分析（無料）</h2>${freeAnalysis(points)}<h2>サーブレシーブミス（方向別）</h2><p class="muted">相手サーブに対するレシーブミスの内訳。記録数であり、成功率ではありません。</p><div class="scroll"><table><thead><tr><th>選手</th><th>前</th><th>後ろ</th><th>左右</th><th>その他</th><th>合計</th></tr></thead><tbody>${Object.entries(byPlayer).sort((a,b)=>b[1].total-a[1].total).map(([id,v])=>`<tr><td>${id==='unknown'?'不明':safeName(id)}</td><td>${v.types['前に落ちた']}</td><td>${v.types['下がりながら']}</td><td>${v.types['サイド']}</td><td>${v.types['その他']}</td><td><b>${v.total}</b></td></tr>`).join('')||'<tr><td colspan="6">まだ記録がありません</td></tr>'}</tbody></table></div><h2>得失点理由の内訳</h2><div class="scroll"><table><thead><tr><th>理由</th><th>回数</th></tr></thead><tbody>${Object.entries(reasonTotals).sort((a,b)=>b[1]-a[1]).map(([reason,count])=>`<tr><td>${esc(reason)}</td><td>${count}</td></tr>`).join('')||'<tr><td colspan="2">まだ記録がありません</td></tr>'}</tbody></table></div>${Object.keys(legacy).length?`<h2>旧プレー記録の集計</h2><div class="scroll"><table><thead><tr><th>選手</th><th>プレー</th><th>記録</th><th>成功</th><th>ミス</th></tr></thead><tbody>${Object.entries(legacy).map(([key,v])=>{let [id,skill]=key.split('|');return `<tr><td>${safeName(id)}</td><td>${esc(skill)}</td><td>${v.count}</td><td>${v.good}</td><td>${v.miss}</td></tr>`}).join('')}</tbody></table></div>`:''}<p class="muted">得点・失点だけの記録では全プレーの試行回数が不明なため、成功率は表示しません。動画分析で補完してください。</p><div class="row">${btn('📊 選手別Excel集計',`exportExcelSummary(${m.id})`,'primary')}${btn('CSV出力',`exportCSV(${m.id})`,'primary')}${btn('JSONバックアップ','backup()')}</div></section>`}
function historyPage(){return `<section class="card"><h2>試合履歴</h2>${data.matches.slice().reverse().map(m=>`<div class="log"><b>${esc(m.date)} ${esc(m.team)} vs ${esc(m.opponent)}</b><div class="row" style="margin-top:7px">${btn('記録を再開',`openMatch(${m.id})`)}${btn('分析',`reportId=${m.id};tab='report';draw()`)}${btn('削除',`deleteMatch(${m.id})`,'danger')}</div></div>`).join('')||'<p>履歴はありません。</p>'}</section><section class="card"><h2>データ管理</h2><div class="row">${btn('全データをバックアップ','backup()','primary')}<label class="pill">JSON復元 <input type="file" accept="application/json,.json" onchange="restore(this.files[0])" style="max-width:190px"></label></div><p class="muted">データはこのブラウザ内に保存されます。端末変更・履歴削除に備えて定期的にバックアップしてください。</p></section>`}
async function importRosterFile(input){let file=input.files?.[0];if(!file)return;try{if(typeof XLSX==='undefined')throw Error('Excel読み込みライブラリが使えません。通信を確認してください');let book=XLSX.read(await file.arrayBuffer(),{type:'array'}),incoming=[];for(let [sheetName,teamName] of [['男子名簿','男子'],['女子名簿','女子']]){let sheet=book.Sheets[sheetName];if(!sheet)continue;let rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});let h=rows.findIndex(r=>r.some(v=>String(v).trim()==='氏名'));if(h<0)continue;let col=rows[h].findIndex(v=>String(v).trim()==='氏名');for(let r of rows.slice(h+1)){let name=String(r[col]||'').trim();if(name)incoming.push({name,team:teamName})}}if(!incoming.length)throw Error('男子名簿・女子名簿の氏名列が見つかりません');let added=0;for(let p of incoming){let key=p.name.replace(/\s/g,'');if(!data.players.some(q=>(q.team||'女子')===p.team&&q.name.replace(/\s/g,'')===key)){data.players.push({id:uid(),name:p.name,number:'',team:p.team});added++}}persist();draw();alert('名簿'+incoming.length+'名を確認、'+added+'名を追加しました。既存データは保持しています。')}catch(e){alert('読み込み失敗：'+e.message)}finally{input.value=''}}
function addPlayer(){let name=$('pname').value.trim(),t=$('pteam').value;if(!name)return alert('名前を入力してください');if(data.players.some(p=>p.team===t&&p.name.replace(/\s/g,'')===name.replace(/\s/g,'')))return alert('登録済みの名前です');data.players.push({id:uid(),name,number:'',team:t});persist();draw()}
function removePlayer(id){if(!confirm('登録解除しますか？過去の記録は残ります。'))return;data.players=data.players.filter(p=>p.id!==id);persist();draw()}
function startMatch(){let name=$('opponent').value.trim();if(!name)return alert('対戦相手を入力してください');if(!data.players.some(p=>p.team===team))return alert('先に「選手」で選手を登録してください');let m={id:uid(),team,opponent:name,date:new Date().toLocaleDateString('ja-JP'),set:1,sets:[{ours:0,theirs:0}],lineup:[null,null,null,null,null,null],events:[],actions:[],serveOrder:[null,null,null,null,null,null],serveIndex:0,hasServed:false,substitutions:[]};data.matches.push(m);data.current=m.id;showNewMatch=false;selected=null;pendingScore=null;pendingCategory=null;pendingReason=null;persist();draw()}
function setLineup(){let m=match();if(!m)return;document.getElementById('lineupEditor')?.scrollIntoView({behavior:'smooth',block:'center'})}

function setServeOrder(i,value){let m=match();if(!m||serveLocked(m))return alert('試合開始後はサーブ順を変更できません');let id=value===''?null:Number(value);if(id!=null&&!m.lineup.includes(id))return alert('コート上の選手を選んでください');let order=[...(m.serveOrder||Array(6).fill(null))];if(id!=null&&order.some((x,j)=>j!==i&&String(x)===String(id)))return alert('同じ選手を2回登録できません');order[i]=id;m.serveOrder=order;persist();draw()}
function assignPosition(pos,value){let m=match();if(!m)return;let id=value===''?null:Number(value);if(id!=null&&!data.players.some(p=>p.id===id&&p.team===m.team))return alert('選手が見つかりません');if(id!=null&&m.lineup.some((x,i)=>i!==pos-1&&String(x)===String(id)))return alert('すでに別の位置にいる選手です');let old=m.lineup[pos-1];if(String(old)===String(id))return;if(serveLocked(m)&&old!=null&&id==null)return alert('試合中は交代する選手を選択してください');m.actions??=[];m.actions.push({type:'substitution',prevLineup:[...m.lineup],prevOrder:[...(m.serveOrder||[])],prevSubCount:(m.substitutions||[]).length});m.lineup[pos-1]=id;if(!serveLocked(m)){m.serveOrder??=Array(6).fill(null);m.serveOrder=m.serveOrder.map(x=>x===old?id:x)}else{m.substitutions??=[];m.substitutions.push({set:m.set,pos,outId:old,inId:id,time:new Date().toISOString()});m.serveOrder=(m.serveOrder||[]).map(x=>x===old?id:x)}selected=null;persist();draw()}
function substitutePosition(pos){let m=match();if(!m)return;let available=data.players.filter(p=>p.team===m.team);let options=available.map(p=>p.number+':'+p.name).join(' / ');let num=prompt('位置'+pos+'の交代選手の背番号を入力してください。\n'+options);if(num===null)return;let p=available.find(p=>String(p.number)===num.trim());if(!p)return alert('背番号が見つかりません');assignPosition(pos,String(p.id))}
function chooseSkill(s){skill=s;draw()}

const pointCategories={ours:{'サーブ':['サービスエース'],'レシーブ':['相手のレシーブミス'],'アタック':['アタック決定','フェイント決定','相手のアタックミス（ネット）','相手のアタックミス（アウト）'],'ブロック':['ブロック決定'],'トス・つなぎ':['相手のトス・つなぎミス'],'反則・その他':['相手の反則','その他・不明']},theirs:{'サーブ':['七塚のサーブミス（ネット）','七塚のサーブミス（アウト）','相手のサービスエース'],'サーブレシーブ':['サーブレシーブミス（前に落ちた）','サーブレシーブミス（下がりながら）','サーブレシーブミス（サイド）','サーブレシーブミス（その他）'],'レシーブ':['七塚のレシーブミス（オーバー）','七塚のレシーブミス（アンダー）','七塚のレシーブミス（触れずに失点）'],'アタック':['七塚のアタックミス（ネット）','七塚のアタックミス（アウト）','相手のアタック決定','相手のフェイント決定'],'ブロック':['七塚のアタックがブロックされた','相手のブロック決定'],'トス・つなぎ':['七塚のトスミス','七塚のつなぎミス'],'反則・その他':['七塚の反則','その他・不明']}};function serveOnlyReason(reason){return reason==='サービスエース'||reason?.startsWith('七塚のサーブミス')}function opponentServeReason(reason){return reason?.startsWith('相手のサーブ')}function setServing(side){let m=match();if(!m)return;if(serveLocked(m))return alert('試合中のサーブ権は得点に合わせて自動で切り替わります');m.actions??=[];m.actions.push({type:'serveSetting',prev:m.serving??null});m.serving=side;persist();draw()}function chooseScore(side){let m=match();if(setFinished(m))return alert('このセットは終了しています。次のセットへ進んでください');if(courtChangeDue(m))return alert('8点到達です。先にコートチェンジ完了を押してください');pendingScore=side;pendingCategory=null;pendingReason=null;draw()}function availableCategories(m,side){let keys=Object.keys(pointCategories[side]);if(!m?.serving)return keys;return keys.filter(k=>!(side==='ours'&&k==='レシーブ')&&!(side==='theirs'&&k==='サーブレシーブ'&&m.serving==='ours'))}
function availableReasons(m,side,cat){let reasons=pointCategories[side]?.[cat]||[];if(!m?.serving)return reasons;return reasons.filter(r=>{if(side==='ours'&&r==='サービスエース')return m.serving==='ours';if(side==='ours'&&r==='相手のレシーブミス')return m.serving==='ours';if(side==='theirs'&&r.startsWith('七塚のサーブミス'))return m.serving==='ours';if(side==='theirs'&&r==='相手のサービスエース')return m.serving==='theirs';return true})}
function shortReason(r){return r.replace(/^七塚の/,'').replace(/^相手の/,'相手 ').replace('サーブレシーブミス','サーブレシーブ').replace('（','：').replace('）','')}
function choosePointCategoryByName(cat){if(!pendingScore||!availableCategories(match(),pendingScore).includes(cat))return;pendingCategory=cat;pendingReason=null;let options=availableReasons(match(),pendingScore,cat);if(options.length===1){scoreWithReasonByName(options[0]);return}draw()}
function scoreWithReasonByName(reason){if(!pendingScore||!pendingCategory||!availableReasons(match(),pendingScore,pendingCategory).includes(reason))return;pendingReason=reason;let m=match();if(serveOnlyReason(reason)&&m.serving==='ours'&&currentServer(m)!=null){scoreWithPlayer(currentServer(m));return}if(pendingScore==='ours'&&reason==='相手のレシーブミス'){scoreWithPlayer(null,'相手のレシーブミス');return}if(opponentServeReason(reason)){scoreWithPlayer(null,'相手選手');return}draw()}
function choosePointCategory(index){if(!pendingScore)return;choosePointCategoryByName(availableCategories(match(),pendingScore)[index])}function scoreWithReason(index){if(!pendingScore||!pendingCategory)return;scoreWithReasonByName(availableReasons(match(),pendingScore,pendingCategory)[index])}function scoreWithPlayer(id,actor){if(!pendingScore||!pendingReason)return;if(serveOnlyReason(pendingReason)){let m=match();if(m.serving!=='ours'||currentServer(m)==null||String(id)!==String(currentServer(m)))return alert('現在のサーバーだけ選択できます。サーブ権と位置1を確認してください。')}if(opponentServeReason(pendingReason)&&id!=null)return alert('相手のサーブは七塚の選手に割り当てられません');const side=pendingScore,reason=pendingReason;pendingScore=null;pendingCategory=null;pendingReason=null;score(side,1,reason,id,actor)}
function score(side,delta,reason='理由未記録',playerId=null,actor='不明'){let m=match();if(setFinished(m))return alert('セットは終了しています');if(courtChangeDue(m))return alert('先にコートチェンジを完了してください');if(!m.serving)return alert('最初のサーブ権を設定してください');if((m.serveOrder||[]).filter(x=>x!=null).length!==6)return alert('6人のサーブ順を設定してください');m.actions??=[];m.pointEvents??=[];const prevServing=m.serving,prevServeIndex=m.serveIndex||0,prevHasServed=!!m.hasServed;if(m.serving!==side){if(side==='ours'&&m.hasServed)m.serveIndex=((m.serveIndex||0)+1)%6;m.serving=side}if(side==='ours')m.hasServed=true;m.sets[m.set-1][side]+=delta;const point={set:m.set,side,reason,playerId,actor:playerId!=null?'七塚選手':actor,time:new Date().toISOString()};m.pointEvents.push(point);m.actions.push({type:'score',set:m.set,side,point,prevServing,prevServeIndex,prevHasServed});persist();draw()}
function undoScore(k){let m=match();if(!m||!['ours','theirs'].includes(k))return;let s=m.sets[m.set-1];if(!s||s[k]<=0)return;m.actions??=[];m.pointEvents??=[];let ix=m.pointEvents.findLastIndex(e=>e.set===m.set&&e.side===k);let removed=ix>=0?m.pointEvents.splice(ix,1)[0]:null;let prevServing=m.serving??null,prevLineup=[...m.lineup],prevServeIndex=m.serveIndex||0,prevHasServed=!!m.hasServed;let actionIndex=m.actions.findLastIndex(a=>a.type==='score'&&a.set===m.set&&a.side===k&&(!removed||a.point?.time===removed.time));let original=actionIndex>=0?m.actions[actionIndex]:null;let latestPoint=m.actions.findLastIndex(a=>a.type==='score'&&a.set===m.set);let safeRestore=!!original&&actionIndex===latestPoint&&m.actions.slice(actionIndex+1).every(a=>a.type==='event');if(safeRestore){m.serving=original.prevServing??null;m.serveIndex=original.prevServeIndex??0;m.hasServed=!!original.prevHasServed}s[k]--;m.actions.push({type:'scoreCorrection',set:m.set,side:k,removed,pointIndex:ix,prevServing,prevLineup,prevServeIndex,prevHasServed});persist();draw();if(original&&!safeRestore)alert('過去の得点を修正しました。サーブ順を確認してください。')}
function nextSet(){let m=match();if(m.set>=3)return alert('第3セットまでです');if(!setFinished(m)&&!confirm('セット終了点に達していません。次のセットに進みますか？'))return;if(setFinished(m)&&!confirm('次のセットを開始しますか？'))return;m.actions??=[];m.actions.push({type:'set',prev:m.set,prevServing:m.serving??null,prevServeIndex:m.serveIndex||0,prevHasServed:!!m.hasServed,prevOrder:[...(m.serveOrder||[])]});m.set++;m.sets[m.set-1]??={ours:0,theirs:0};m.serving=null;m.serveIndex=0;m.hasServed=false;m.serveOrder=Array(6).fill(null);m.courtChanged=false;persist();draw()}
function undo(){let m=match();if(!m)return;m.actions??=[];let a=m.actions.pop();if(!a)return alert('取り消す操作がありません');if(a.type==='event')m.events.pop();if(a.type==='score'){m.serving=a.prevServing??null;m.serveIndex=a.prevServeIndex??0;m.hasServed=!!a.prevHasServed;m.sets[a.set-1][a.side]=Math.max(0,m.sets[a.set-1][a.side]-1);if(a.point){m.pointEvents??=[];let i=m.pointEvents.findIndex(e=>e.time===a.point.time&&e.side===a.point.side);if(i>=0)m.pointEvents.splice(i,1)}}if(a.type==='scoreCorrection'){if(a.prevLineup)m.lineup=[...a.prevLineup];m.serving=a.prevServing??null;m.serveIndex=a.prevServeIndex??0;m.hasServed=!!a.prevHasServed;m.sets[a.set-1][a.side]++;if(a.removed){m.pointEvents??=[];m.pointEvents.splice(Math.max(0,a.pointIndex),0,a.removed)}}if(a.type==='lineup')m.lineup=a.prev;if(a.type==='set'){m.set=a.prev;m.courtChanged=false;m.serving=a.prevServing??null;m.serveIndex=a.prevServeIndex??0;m.hasServed=!!a.prevHasServed;m.serveOrder=a.prevOrder||Array(6).fill(null)}if(a.type==='serveSetting')m.serving=a.prev;if(a.type==='substitution'){m.lineup=a.prevLineup;m.serveOrder=a.prevOrder;m.substitutions=(m.substitutions||[]).slice(0,a.prevSubCount)}persist();draw()}
