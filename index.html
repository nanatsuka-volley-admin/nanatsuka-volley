return `<div class="score-modal-backdrop" onclick="closeSetup()"><section class="score-modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="score-modal-head"><strong>🏐 ${kind==='order'?'サーブ順':kind==='sub'?'選手交代':'出場選手'}の設定</strong>${btn('✕ 閉じる','closeSetup()')}</div><div class="score-modal-body">${body}</div></section></div>`}
function toggleLineup(id){let m=match();if(!m)return;if(serveLocked(m))return alert('試合中の変更は選手交代から行ってください');let chosen=(m.serveOrder||[]).filter(x=>x!=null);if(chosen.includes(id)){chosen=chosen.filter(x=>x!==id)}else{if(chosen.length>=6)return alert('6人までです');chosen.push(id)}m.serveOrder=[...chosen,...Array(6-chosen.length).fill(null)];m.lineup=[...chosen,...Array(6-chosen.length).fill(null)];m.serveIndex=0;m.hasServed=false;persist();draw()}
function appendServeOrder(id){let m=match();if(!m||serveLocked(m))return;if(!m.lineup.includes(id))return;let order=m.serveOrder||Array(6).fill(null);if(order.includes(id))return;let i=order.indexOf(null);if(i<0)return;m.serveOrder=[...order];m.serveOrder[i]=id;persist();draw()}
function popServeOrder(){let m=match();if(!m||serveLocked(m))return;let i=(m.serveOrder||[]).findLastIndex(x=>x!=null);if(i>=0)m.serveOrder[i]=null;persist();draw()}
function replaceLineup(i,id){let m=match(),old=m.lineup[i];if(!old||m.lineup.includes(id))return;assignPosition(i+1,String(id));closeSetup()}

function playersPage(){return `<section class="card"><h2>選手登録</h2><p><button class="primary" onclick="document.getElementById('rosterFile').click()">📂 Excel名簿を読み込む</button><input id="rosterFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="importRosterFile(this)"></p><p class="muted">男子名簿・女子名簿から氏名を登録。既存の記録は保持します。</p><div class="row"><select id="pteam"><option>女子</option><option>男子</option></select><input id="pname" placeholder="選手名" style="flex:1"><button class="primary" onclick="addPlayer()">追加</button></div><p class="muted">最初に選手を登録してください。データのない選手名は自動補完しません。</p></section>${['女子','男子'].map(t=>`<section class="card"><h2>${t}（${data.players.filter(p=>p.team===t).length}名）</h2>${data.players.filter(p=>p.team===t).map(p=>`<div class="log row" style="justify-content:space-between"><span>${safeName(p.id)}</span>${btn('登録解除',`removePlayer(${JSON.stringify(p.id)})`)}</div>`).join('')||'<p class="muted">未登録</p>'}</section>`).join('')}`}
function freeAnalysis(points){if(!points.length)return '<p>得失点を記録すると分析を表示します。</p>';let loss=points.filter(e=>e.side==='theirs'),win=points.filter(e=>e.side==='ours'),counts={};for(let e of loss)counts[e.reason||'不明']=(counts[e.reason||'不明']||0)+1;let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];let direction={前:0,後ろ:0,左右:0};for(let e of loss){if(e.reason?.includes('前に落ちた'))direction.前++;if(e.reason?.includes('下がりながら'))direction.後ろ++;if(e.reason?.includes('サイド'))direction.左右++}let streak=0,maxLoss=0;for(let e of points){streak=e.side==='theirs'?streak+1:0;maxLoss=Math.max(maxLoss,streak)}let focus=direction.前>=direction.後ろ&&direction.前>=direction.左右&&direction.前>0?'前方への一歩目と落下点の判断':direction.後ろ>=direction.左右&&direction.後ろ>0?'後方への移動と体勢づくり':direction.左右>0?'左右への一歩目と守備範囲':'失点が多いプレーの再確認';return `<div class="hint"><p>記録得点：${win.length}件 ／ 記録失点：${loss.length}件</p><p>最多失点理由：${esc(top?top[0]:'なし')}（${top?top[1]:0}件）</p><p>最大連続失点：${maxLoss}点</p><p>サーブレシーブミス：前${direction.前}・後ろ${direction.後ろ}・左右${direction.左右}件</p><p><b>次の練習テーマ候補：</b>${esc(focus)}</p></div><p class="muted">記録から自動集計しています。外部AI送信なし・追加料金なし。未記録のプレーは対象外です。</p>`}
const quickPositive={'サーブ':['成功','エース'],'サーブレシーブ':['A（良好）'],'セッターのトス':['良い'],'2段トス':['良い'],'スパイク':['決定'],'ディグ':['良好'],'ブロック':['得点','ワンタッチ'],'ツーアタック':['決定']};
function quickServeEvents(m){return (m.pointEvents||[]).filter(e=>e.servingSide==='ours'&&e.servingPlayerId!=null).map(e=>{let miss=e.reason?.includes('七塚のサーブミス'),ace=e.reason==='サービスエース';return {set:e.set,skill:'サーブ',playerId:e.servingPlayerId,result:miss?'ミス':ace?'エース':'成功',time:e.time,automatic:true}})}function quickPointEvents(m){return (m.pointEvents||[]).flatMap(e=>{let r=e.reason||'',skill=null,result=null,id=e.playerId;if(e.side==='ours'){if(r==='サービスエース'||r==='サーブで崩して得点')return [];if(r.includes('ツーアタック決定')){skill='ツーアタック';result='決定'}else if(r.includes('スパイク決定')||r.includes('プッシュ決定')||r.includes('フェイント決定')||r.includes('ブロックアウト')||r.includes('ダイレクト返球決定')){skill='スパイク';result='決定'}else if(r==='ブロック決定'){skill='ブロック';result='得点'}else if(r.startsWith('相手の')){skill='相手のミス';result=r;id=null}}else{if(r.startsWith('七塚のサーブミス'))return [];if(r.startsWith('サーブレシーブミス')){skill='サーブレシーブ';result='ミス'}else if(r.startsWith('ディグミス')||r.startsWith('七塚のレシーブミス')||r.startsWith('フェイント対応ミス')||r.startsWith('チャンスボール処理ミス')){skill='ディグ';result='ミス'}else if(r.startsWith('七塚のスパイクミス')||r==='七塚のスパイクがブロックされた'){skill='スパイク';result='ミス'}else if(r.startsWith('ツーアタックミス')){skill='ツーアタック';result='ミス'}else if(r.startsWith('七塚のブロックミス')||r.startsWith('七塚のブロックアウト')){skill='ブロック';result='ミス'}else if(r==='七塚のトスミス'){skill='セッターのトス';result='ミス'}else if(r.startsWith('ラストボール返球ミス')){skill='返球';result=r.includes('オーバー')?'オーバー':r.includes('アンダー')?'アンダー':'打って返す'}else if(r.includes('お見合い')){skill='連携ミス';result='お見合い';id=null}else if(r.startsWith('七塚のつなぎミス')||r.startsWith('返球失敗')){skill='2段トス';result='ミス'}}if(!skill)return [];if(id==null&&skill!=='相手のミス'&&skill!=='連携ミス')return [];return [{set:e.set,skill,playerId:id,result,detail:r,time:e.time,automatic:true,source:'point'}]})}
function quickAllEvents(m){return [...(m.quickEvents||[]),...quickServeEvents(m),...quickPointEvents(m)]}
function quickGroups(m){let groups=new Map();for(const e of quickAllEvents(m)){const id=e.playerId==null?'team':String(e.playerId),key=id+'|'+e.skill;if(!groups.has(key))groups.set(key,{id,skill:e.skill,total:0,counts:{},details:{}});const g=groups.get(key);g.total++;g.counts[e.result]=(g.counts[e.result]||0)+1;if(e.detail)g.details[e.detail]=(g.details[e.detail]||0)+1}return [...groups.values()]}
function quickPct(n,d){return d?Math.round(n/d*100)+'%':'—'}
function quickBar(n,total,color='#2563eb'){return '<div style="height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden;min-width:75px"><div style="height:100%;width:'+Math.min(100,total?n/total*100:0)+'%;background:'+color+'"></div></div>'}
function quickPage(m){if(!m)return '<section class="card"><h2>📝 簡易記録</h2><p>試合を作成して、出場する6人を選んでください。得失点と簡易プレーを記録できます。</p>'+btn('＋ 新規試合を作成','openMatchWizard()','primary')+'</section>';let es=quickAllEvents(m);return `<section class="card"><h2>📝 簡易プレー記録</h2><p class="muted">得失点の理由と簡易プレーを記録します。サーブ成功は得失点から自動集計します。</p><p><b>${esc(m.team)} vs ${esc(m.opponent)}</b> ／ 第${m.set}セット</p><p>${btn('＋ 新しい試合','openMatchWizard()')} ${btn('次のセット','quickNextSet()')}</p><div class="score"><div><div class="label">七塚</div><strong>${m.sets?.[m.set-1]?.ours||0}</strong>${btn('得点','chooseScore(\'ours\')','score-win')}</div><div><div class="label">相手</div><strong>${m.sets?.[m.set-1]?.theirs||0}</strong>${btn('失点','chooseScore(\'theirs\')','score-lose')}</div></div><p style="text-align:center;margin:10px 0">${btn('↶ 1つ戻る（直前の得失点）','undoLastPoint()','')}</p><div class="server-status ${m.serving==='ours'?'server-ours':m.serving==='theirs'?'server-theirs':'server-unset'}"><span class="server-caption">🏐 現在のサーバー</span><strong class="server-name">${m.serving==='ours'?safeName(currentServer(m)):m.serving==='theirs'?'相手チーム':'未設定'}</strong><span class="server-detail">${m.serving==='ours'?'七塚のサーブ':m.serving==='theirs'?'相手のサーブ':'最初のサーブ権を選択してください'}</span>${!m.serving?'<div class="server-actions">'+btn('七塚から',"quickSetServe('ours')")+btn('相手から',"quickSetServe('theirs')")+'</div>':''}</div><div class="hint"><b>出場中の6人・交代</b><div class="grid2" style="margin-top:8px">${(m.lineup||[]).map((id,i)=>btn((i+1)+'番 '+safeName(id)+' ↔ 交代','openQuickSub('+i+')')).join('')}</div><p class="muted">交代履歴：${(m.substitutions||[]).length}件</p>${(m.substitutions||[]).slice(-5).map(x=>'<div class="muted">'+esc(x.set||m.set)+'セット：'+safeName(x.outId)+' → '+safeName(x.inId)+'</div>').join('')}</div><div class="hint"><b>👇 記録する選手をタップ</b><div class="grid3" style="margin-top:10px">${(m.lineup||[]).filter(id=>id!=null).map(id=>btn(safeName(id),'openQuickEntry('+JSON.stringify(id)+')','primary')).join('')}</div><p>${btn('相手のミス','quickEntry={skill:\'相手のミス\',playerId:null,step:2};draw()')}${btn('チーム連携','quickEntry={skill:\'連携ミス\',playerId:null,step:2};draw()')}</p></div><div class="row">${btn('📥 簡易記録をExcel出力','exportQuickExcel()')}</div><p class="muted">記録件数：${es.length}件</p></section><section class="card"><h2>📊 チーム成績</h2>${quickTeamHtml(m)}</section><section class="card"><h2>👤 個人成績</h2>${quickPlayerHtml(m)}</section><section class="card"><h2>直近の簡易記録</h2>${es.length?es.map((e,i)=>({e,i})).reverse().slice(0,30).map(({e,i})=>`<div class="row" style="justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e5e7eb"><span>第${e.set}セット｜${esc(e.skill)}｜${e.playerId!=null?safeName(e.playerId):'チーム'}｜<b>${esc(e.result)}</b></span>${btn('削除','deleteQuickEntry('+i+')')}</div>`).join(''):'<p class="muted">まだ記録がありません。</p>'}</section>`}
function quickTeamHtml(m){let groups=quickGroups(m),es=quickAllEvents(m);if(!es.length)return '<p class="muted">まだ記録がありません。</p>';let skills=Object.keys(quickTaxonomy),max=Math.max(1,...skills.map(k=>es.filter(e=>e.skill===k).length));return '<p class="muted">プレー別の記録数（横棒グラフ）</p>'+skills.map(k=>{let rows=groups.filter(g=>g.skill===k),total=rows.reduce((n,g)=>n+g.total,0);if(!total)return '';let counts={};for(const g of rows)for(const [result,n] of Object.entries(g.counts))counts[result]=(counts[result]||0)+n;let good=(quickPositive[k]||[]).reduce((n,v)=>n+(counts[v]||0),0);return '<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><b>'+esc(k)+'</b><span>'+total+'件</span></div>'+quickBar(total,max)+'<div class="muted" style="font-size:12px;margin-top:4px">'+Object.entries(counts).map(([v,n])=>esc(v)+' '+n+'件').join(' ／ ')+(quickPositive[k]?' ／ 良好・決定率 '+quickPct(good,total):'')+'</div></div>'}).join('')}
function quickMissLabel(reason){let r=String(reason||'');if(r.startsWith('サーブレシーブミス')||r.startsWith('ディグミス')){let method=r.includes('オーバー')?'オーバー':r.includes('アンダー')?'アンダー':r.includes('ノータッチ')?'ノータッチ':'';let dir=r.match(/(?:弾いた：|ノータッチ：|落球）：)(左|右|前|後ろ|正面|横|その他)/)?.[1];if(!dir)dir=r.match(/(?:：)(左|右|前|後ろ|正面|横|その他)）/)?.[1];if(r.includes('お見合い'))return 'お見合い';if(r.includes('アウト判断'))return 'アウト判断';if(dir)return (method?method+'・':'')+(r.includes('ノータッチ')?'ノータッチ '+dir:r.includes('弾いた')?dir+'に弾いた':dir);return r.replace(/^.*?（/,'').replace(/）$/,'')}if(r.startsWith('七塚のレシーブミス'))return r.replace('七塚のレシーブミス（','').replace(/）$/,'');if(r.startsWith('七塚のスパイクミス'))return r.replace('七塚のスパイクミス（','').replace(/）$/,'');if(r.startsWith('七塚のサーブミス'))return r.replace('七塚のサーブミス（','').replace(/）$/,'');return r}
function statType(v){v=String(v||'');return /ミス|失敗|弾いた|ノータッチ|落球|お見合い|ネット|アウト|空振り|ブロックされた/.test(v)?'miss':/決定|得点|エース|成功/.test(v)?'win':'other'}function statColor(v,label){let type=statType(v);return '<span style="color:'+(type==='miss'?'#cf3045':type==='win'?'#128653':'inherit')+';font-weight:'+(type==='other'?'400':'800')+'">'+esc(label==null?v:label)+'</span>'}function excelMark(v,label){let type=statType(v);return (type==='miss'?'🔴 ':type==='win'?'🟢 ':'')+(label==null?v:label)}function quickMissText(g){return Object.entries(g.details||{}).map(([r,n])=>statColor(r,quickMissLabel(r)+'：'+n+'件')).join(' / ')||'—'}
function quickAttackSummary(g){let wins=g.counts['決定']||0,errors=g.counts['ミス']||0,den=wins+errors;return '決定 '+wins+'本 / 直接失点 '+errors+'本 / 決定・ミス比率 '+quickPct(wins,den)}
function quickPlayerHtml(m){let groups=quickGroups(m).filter(g=>g.id!=='team');if(!groups.length)return '<p class="muted">個人の記録はまだありません。</p>';let ids=[...new Set(groups.map(g=>g.id))];return ids.map(id=>{let gs=groups.filter(g=>g.id===id),total=gs.reduce((n,g)=>n+g.total,0);return '<details style="margin:8px 0;border:1px solid #dce5ee;border-radius:10px;padding:10px" open><summary><b>'+safeName(id)+'</b>　'+total+'プレー</summary><div class="scroll"><table><thead><tr><th>プレー</th><th>件数</th><th>結果内訳</th><th>内容</th><th>指標</th></tr></thead><tbody>'+gs.map(g=>{let good=(quickPositive[g.skill]||[]).reduce((n,v)=>n+(g.counts[v]||0),0);let metric=g.skill==='スパイク'?quickAttackSummary(g):quickPositive[g.skill]?('良好・決定率 '+quickPct(good,g.total)):'—';return '<tr><td>'+esc(g.skill)+'</td><td>'+g.total+'</td><td>'+Object.entries(g.counts).map(([v,n])=>statColor(v,v+':'+n)).join(' / ')+'</td><td style="white-space:normal;min-width:150px">'+quickMissText(g)+'</td><td style="white-space:normal;min-width:170px">'+metric+'</td></tr>'}).join('')+'</tbody></table></div></details>'}).join('')}

function exportQuickExcel(){const m=match();if(!m)return;if(typeof XLSX==='undefined')return alert('Excel出力機能を読み込めません。通信状態を確認してください。');let es=quickAllEvents(m),groups=quickGroups(m),book=XLSX.utils.book_new();let detail=[['セット','選手','プレー','評価','内容','日時'],...es.map(e=>[e.set,e.playerId!=null?(player(e.playerId)?.name||'登録解除選手'):'チーム',e.skill,e.result,e.detail?excelMark(e.detail,quickMissLabel(e.detail)):'',e.time])];let individual=[['選手','プレー','件数','結果内訳','内容','決定数','直接失点数','決定・ミス比率','良好・決定率'],...groups.filter(g=>g.id!=='team').map(g=>{let good=(quickPositive[g.skill]||[]).reduce((n,v)=>n+(g.counts[v]||0),0),win=g.counts['決定']||0,miss=g.counts['ミス']||0;return [player(g.id)?.name||'登録解除選手',g.skill,g.total,Object.entries(g.counts).map(([k,v])=>excelMark(k,k+':'+v)).join(' / '),Object.entries(g.details||{}).map(([k,v])=>excelMark(k,quickMissLabel(k)+':'+v)).join(' / '),g.skill==='スパイク'?win:'',g.skill==='スパイク'?miss:'',g.skill==='スパイク'&&win+miss?win/(win+miss):'',g.skill==='スパイク'?'':quickPositive[g.skill]?good/g.total:'']})];let team=[['プレー','記録数','良好・決定数','良好・決定率','評価内訳'],...Object.keys(quickTaxonomy).map(skill=>{let gs=groups.filter(g=>g.skill===skill),n=gs.reduce((v,g)=>v+g.total,0),counts={};for(let g of gs)for(let [k,v] of Object.entries(g.counts))counts[k]=(counts[k]||0)+v;let good=(quickPositive[skill]||[]).reduce((v,k)=>v+(counts[k]||0),0);return [skill,n,quickPositive[skill]?good:'',n&&quickPositive[skill]?good/n:'',Object.entries(counts).map(([k,v])=>k+':'+v).join(' / ')]})];for(let [name,rows] of [['個人成績',individual],['チーム成績',team],['簡易記録一覧',detail]]){let ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((_,i)=>({wch:i===rows[0].length-1?55:20}));if(name==='個人成績'||name==='チーム成績'){let cols=name==='個人成績'?['H','I']:['D'];for(let col of cols)for(let i=2;i<=rows.length;i++){let cell=ws[col+i];if(cell&&typeof cell.v==='number')cell.z='0.0%'}}XLSX.utils.book_append_sheet(book,ws,name)}XLSX.writeFile(book,'七塚_簡易記録_'+String(m.date||'').replaceAll('/','-')+'.xlsx')}
function reportPage(){let m=data.matches.find(x=>String(x.id)===String(reportId))||match()||data.matches.at(-1);if(!m)return '<section class="card"><h2>📊 簡易記録の分析</h2><p>まだ試合データがありません。</p></section>';let es=m.quickEvents||[];return `<section class="card"><h2>📊 簡易記録の分析</h2><p class="muted">簡易プレー記録と得失点理由から自動反映された成績を集計しています。スパイクの決定・ミス比率は総試技成功率ではありません。</p><select class="wide" onchange="reportId=this.value;draw()">${data.matches.slice().reverse().map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(m.id)?'selected':''}>${esc(x.date)} ${esc(x.team)} vs ${esc(x.opponent)}</option>`).join('')}</select><p><b>${esc(m.team)} vs ${esc(m.opponent)}</b>　／　簡易記録 ${es.length}件</p><p>${btn('📥 集計をExcel出力','exportQuickExcelFor('+JSON.stringify(m.id)+')','primary')}</p></section><section class="card"><h2>🏐 チーム成績・グラフ</h2>${quickTeamHtml(m)}</section><section class="card"><h2>👤 個人成績</h2>${quickPlayerHtml(m)}</section><section class="card"><h2>📋 評価別件数</h2>${quickDetailTable(m)}</section>`}

async function importRosterFile(input){let file=input.files?.[0];if(!file)return;try{if(typeof XLSX==='undefined')throw Error('Excel読み込みライブラリが使えません。通信を確認してください');let book=XLSX.read(await file.arrayBuffer(),{type:'array'}),incoming=[];for(let [sheetName,teamName] of [['男子名簿','男子'],['女子名簿','女子']]){let sheet=book.Sheets[sheetName];if(!sheet)continue;let rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});let h=rows.findIndex(r=>r.some(v=>String(v).trim()==='氏名'));if(h<0)continue;let col=rows[h].findIndex(v=>String(v).trim()==='氏名');for(let r of rows.slice(h+1)){let name=String(r[col]||'').trim();if(name)incoming.push({name,team:teamName})}}if(!incoming.length)throw Error('男子名簿・女子名簿の氏名列が見つかりません');let added=0;for(let p of incoming){let key=p.name.replace(/\s/g,'');if(!data.players.some(q=>(q.team||'女子')===p.team&&q.name.replace(/\s/g,'')===key)){data.players.push({id:uid(),name:p.name,number:'',team:p.team});added++}}persist();draw();alert('名簿'+incoming.length+'名を確認、'+added+'名を追加しました。既存データは保持しています。')}catch(e){alert('読み込み失敗：'+e.message)}finally{input.value=''}}

function matchWizardHtml(){let w=matchWizard;if(!w)return '';let eligible=data.players.filter(p=>(p.team||'女子')===w.team);let body=w.step===1?`<h2>① 対戦相手・試合形式</h2><label>チーム <select id="wizardTeam"><option value="女子" ${w.team==='女子'?'selected':''}>女子</option><option value="男子" ${w.team==='男子'?'selected':''}>男子</option></select></label><p><input id="wizardOpponent" placeholder="対戦相手名" value="${esc(w.opponent)}" style="width:100%"></p><label>試合形式 <select id="wizardFormat"><option value="3" ${w.maxSets===3?'selected':''}>大会・3セットマッチ</option><option value="2" ${w.maxSets===2?'selected':''}>大会・2セットのみ</option><option value="1" ${w.maxSets===1?'selected':''}>練習試合・1セットのみ</option></select></label><p>${btn('次へ →','wizardNext()','primary')}</p>`:w.step===2?`<h2>② 出場6人を選択</h2><p class="muted">サーブ1番から6番の順に選択してください。</p><div class="grid2">${Array.from({length:6},(_,i)=>`<div class="hint">${i+1}番：${w.order[i]!=null?safeName(w.order[i]):'未設定'}</div>`).join('')}</div><div class="grid3">${eligible.map(p=>btn((w.order.includes(p.id)?(w.order.indexOf(p.id)+1)+'番 ':'')+'#'+esc(p.number)+' '+esc(p.name),`wizardPickPlayer(${JSON.stringify(p.id)})`,w.order.includes(p.id)?'primary':'')).join('')}</div><p>${btn('← 戻る','wizardBack()')} ${btn('記録を開始 →','wizardNext()','primary')}</p>`:`<h2>③ 試合開始</h2><p><b>${esc(w.team)} vs ${esc(w.opponent)}</b></p><p class="muted">サーブ順：${w.order.map((id,i)=>(i+1)+'番 '+safeName(id)).join(' → ')}</p><p>最初にサーブするチームを選ぶと試合記録を開始します。</p><div class="grid2">${btn('🏐 七塚からサーブ',"wizardStart('ours')",'primary')}${btn('🏐 相手からサーブ',"wizardStart('theirs')",'primary')}</div><p>${btn('← 戻る','wizardBack()')}</p>`;return `<div class="score-modal-backdrop"><section class="score-modal" role="dialog" aria-modal="true" aria-label="新規試合の設定"><div class="score-modal-head"><strong>🏐 新規試合設定（${w.step}/3）</strong>${btn('✕ キャンセル','closeMatchWizard()')}</div><div class="score-modal-body">${body}</div></section></div>`}

function exportExcelSummary(id){const m=data.matches.find(x=>x.id===id);if(!m)return;if(typeof XLSX==='undefined')return alert('Excel出力機能を読み込めません。通信状態を確認してください。');const records=individualAnalysis(m),points=m.pointEvents||[],book=XLSX.utils.book_new();const quickRows=[['セット','選手','プレー','評価','日時'],...(m.quickEvents||[]).map(e=>[e.set,e.playerId!=null?(player(e.playerId)?.name||'登録解除選手'):'チーム',e.skill,e.result,e.time])];XLSX.utils.book_append_sheet(book,XLSX.utils.aoa_to_sheet(quickRows),'簡易プレー記録');const allReasons=[...new Set(records.flatMap(r=>Object.keys(r.counts)))].sort((a,b)=>a.localeCompare(b,'ja'));const summary=[['七塚 Volley Stats 選手別分析'],['日付',m.date,'チーム',m.team,'対戦相手',m.opponent],['出場選手のみ。件数は記録された得失点に限ります（成功率ではありません）'],[],['選手','関与得点','関与失点','合計',...allReasons],...records.map(r=>[r.name,r.wins.length,r.losses.length,r.events.length,...allReasons.map(k=>r.counts[k]||0)])];const ws=XLSX.utils.aoa_to_sheet(summary);ws['!cols']=[{wch:22},{wch:15},{wch:15},{wch:12},...allReasons.map(()=>({wch:25}))];XLSX.utils.book_append_sheet(book,ws,'出場選手別集計');const missRows=[['選手','ミス分類','具体的な内容','件数']];for(const r of records){const misses=r.losses.filter(e=>!e.reason?.startsWith('相手の'));const counts={};for(const e of misses)counts[e.reason||'不明']=(counts[e.reason||'不明']||0)+1;for(const [reason,n] of Object.entries(counts).sort((a,b)=>b[1]-a[1]))missRows.push([r.name,reason.split('（')[0],reason,n])}const ms=XLSX.utils.aoa_to_sheet(missRows);ms['!cols']=[{wch:20},{wch:26},{wch:44},{wch:12}];XLSX.utils.book_append_sheet(book,ms,'選手別ミス詳細');const team={};for(const e of points){const k=(e.side==='ours'?'得点':'失点')+'｜'+(e.reason||'不明');team[k]=(team[k]||0)+1}const ts=XLSX.utils.aoa_to_sheet([['チーム得失点理由'],['得失点・理由','件数'],...Object.entries(team).sort((a,b)=>b[1]-a[1])]);ts['!cols']=[{wch:52},{wch:12}];XLSX.utils.book_append_sheet(book,ts,'チーム内訳');const details=[['セット','得失点','選手','理由','日時'],...points.map(e=>[e.set,e.side==='ours'?'得点':'失点',e.playerId!=null?(player(e.playerId)?.name||'登録解除選手'):'相手・不明',e.reason||'',e.time||''])];const ds=XLSX.utils.aoa_to_sheet(details);ds['!cols']=[{wch:12},{wch:12},{wch:22},{wch:46},{wch:27}];XLSX.utils.book_append_sheet(book,ds,'全得失点記録');XLSX.writeFile(book,'七塚_詳細分析_'+String(m.date||'試合').replace(/[\\/:*?"<>|]/g,'-')+'.xlsx')}
function exportPrintReport(id){const m=data.matches.find(x=>x.id===id);if(!m)return;const records=individualAnalysis(m);const safe=x=>esc(String(x??''));const rows=records.map(r=>{const counts={};for(const e of r.losses.filter(e=>!e.reason?.startsWith('相手の')))counts[e.reason||'不明']=(counts[e.reason||'不明']||0)+1;const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return '<section class="person"><h2>'+safe(r.name)+'</h2><p>関与得点 '+r.wins.length+'件 ／ 関与失点 '+r.losses.length+'件</p><table><thead><tr><th>失点理由</th><th>件数</th></tr></thead><tbody>'+(top.map(([k,n])=>'<tr><td>'+safe(k)+'</td><td>'+n+'</td></tr>').join('')||'<tr><td colspan="2">記録なし</td></tr>')+'</tbody></table></section>'}).join('');const w=window.open('','_blank');if(!w)return alert('ポップアップを許可してください');w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>七塚 試合分析</title><style>body{font-family:system-ui,sans-serif;color:#18334e;margin:24px}h1{font-size:22px}.person{break-inside:avoid;margin:18px 0;padding:12px;border:1px solid #ccc;border-radius:8px}h2{font-size:17px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left}th:last-child,td:last-child{width:60px;text-align:right}.note{font-size:12px;color:#555}@media print{.noprint{display:none}body{margin:12mm}}</style></head><body><button class="noprint" onclick="window.print()">印刷・PDF保存</button><h1>七塚 Volley Stats 試合分析</h1><p>'+safe(m.date)+'　'+safe(m.team)+' vs '+safe(m.opponent)+'</p><p class="note">出場選手のみ表示。得失点時に記録した内容の件数であり、ミス率・成功率ではありません。</p>'+rows+'</body></html>');w.document.close()}

function exportCSV(id){let m=data.matches.find(x=>x.id===id);if(!m)return;let rows=[['日付','チーム','対戦相手','セット','時刻','得失点','背番号','選手','プレー・理由','結果']];for(let e of (m.pointEvents||[])){let p=player(e.playerId);rows.push([m.date,m.team,m.opponent,e.set,e.time,e.side==='ours'?'得点':'失点',p?.number||'',p?.name||e.actor||'不明',e.reason||'',e.side==='ours'?'＋1':'－1'])}for(let e of (m.events||[])){let p=player(e.playerId);rows.push([m.date,m.team,m.opponent,e.set,e.time,'旧プレー記録',p?.number||'',p?.name||'不明',e.skill,e.result])}download('volley_'+m.id+'.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('volley_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,...data},null,2),'application/json')}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw Error('形式が違います');if(!confirm('現在のデータをバックアップファイルの内容で上書きしますか？'))return;data={players:d.players,matches:d.matches,current:d.current??null};persist();selected=null;draw();alert('復元しました')}catch(e){alert('復元できません：'+e.message)}}draw();
